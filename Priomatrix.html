                        <p className={`text-[10px] font-bold uppercase tracking-widest mb-1.5 flex items-center gap-1.5 ${meta.text}`}>
                          <span className={`w-1.5 h-1.5 rounded-full ${meta.dot}`}/>{meta.full}
                        </p>
                        <div className="space-y-2">
                          {qList.map(t => <KanbanCard key={t.id} task={t} onOpenNotes={setNotesTask} deleteTask={deleteTask} restoreTask={restoreTask} addToast={addToast}
                            onAdvance={task => setKanbanStatus(task.id, KANBAN_COLS[(KANBAN_COLS.findIndex(c=>c.key===col.key)+1) % KANBAN_COLS.length].key)}/>)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
          {notesTask && <NotesModal task={notesTask} onSave={n=>updateNotes(notesTask.id,n)} onClose={()=>setNotesTask(null)}/>}
        </div>
      );
    };

    // ── Kategorien: neue Kategorie anlegen ─────────────────────────
    const NewCategory = ({ onAdd, existing, compact, autoFocus }) => {
      const [name, setName] = useState('');
      const submit = () => { const n = name.trim(); if (n) { onAdd(n); setName(''); } };
      const sugg = CAT_SUGGEST.filter(n => !existing.some(c => c.name.toLowerCase() === n.toLowerCase()));
      return (
        <div>
          <div className="flex items-center gap-2">
            <input value={name} autoFocus={autoFocus} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}
              placeholder="Neue Kategorie…" enterKeyHint="done"
              className="flex-1 min-w-0 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-xl px-3 py-2 text-sm text-neutral-700 dark:text-neutral-200 outline-none focus:border-blue-400 placeholder-neutral-400"/>
            <button onClick={submit} className="w-11 h-11 flex items-center justify-center rounded-xl bg-blue-500 hover:bg-blue-600 text-white transition-colors shrink-0"><Ic n="plus" size={16}/></button>
          </div>
          {!compact && sugg.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mt-2.5">
              {sugg.map(n => (
                <button key={n} onClick={()=>onAdd(n)} className="px-3.5 min-h-[44px] md:min-h-0 md:px-2.5 md:py-1.5 rounded-full text-xs font-medium bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 text-neutral-600 dark:text-neutral-300 transition-colors">+ {n}</button>
              ))}
            </div>
          )}
        </div>
      );
    };

    // ── Kategorie-Karte ────────────────────────────────────────────
    const CategoryCard = ({ cat, tasks, selectedKw, currentKw, onAdd, onRename, onRecolor, onRemove, taskProps, showDone, collapsed, onToggleCollapse }) => {
      const [input, setInput] = useState('');
      const [openDone, setOpenDone] = useState(false);
      const [menu, setMenu] = useState(false);
      const [name, setName] = useState(null);
      const [dropOver, setDropOver] = useState(false);
      const fileRef = useRef(null);
      const color = cat ? cat.color : '#a1a1aa';
      const done = tasks.filter(t => isDoneT(t, selectedKw)).length;
      const shown = (showDone || openDone) ? tasks : tasks.filter(t => !isDoneT(t, selectedKw));

      const doAdd = () => { if (input.trim()) { onAdd(input, null); setInput(''); } };
      const handlePaste = async (e) => {
        for (const item of (e.clipboardData?.items || [])) {
          if (item.type.startsWith('image/')) { e.preventDefault(); const f = item.getAsFile(); if (f) onAdd(input, await resizeImage(f)); setInput(''); return; }
        }
      };
      const handleFile = async (e) => {
        const f = e.target.files[0];
        if (f?.type.startsWith('image/')) { onAdd(input, await resizeImage(f)); setInput(''); }
        if (fileRef.current) fileRef.current.value = '';
      };
      const handleDrop = async (e) => {
        e.preventDefault(); setDropOver(false);
        try { const d = JSON.parse(e.dataTransfer.getData('application/json')); if (d.type === 'task') { taskProps.moveTask(d.id, cat ? cat.id : null); return; } } catch {}
        const f = e.dataTransfer.files[0];
        if (f?.type.startsWith('image/')) onAdd('', await resizeImage(f));
      };
      const commitName = () => { const n = (name || '').trim(); if (n && n !== cat.name) onRename(cat.id, n); setName(null); };

      return (
        <div onDragOver={e=>{ e.preventDefault(); setDropOver(true); }}
          onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setDropOver(false); }} onDrop={handleDrop}
          className={`relative flex flex-col rounded-2xl overflow-hidden card-shadow border border-neutral-200/70 dark:border-neutral-800 bg-white/60 dark:bg-neutral-900/50 transition-all ${dropOver ? 'ring-2 ring-blue-400' : ''}`}>
          <div className="absolute left-0 top-0 bottom-0 w-1" style={{ background: color }}/>
          <div className="pl-3 pr-2 py-1 md:py-2.5 flex items-center gap-1 border-b border-neutral-200/60 dark:border-neutral-800" style={{ background: color + '1f' }}>
            <button onClick={onToggleCollapse} aria-label={collapsed ? 'Aufklappen' : 'Zuklappen'} className="w-10 h-11 md:w-8 md:h-9 flex items-center justify-center rounded-xl text-neutral-500 hover:bg-black/5 dark:hover:bg-white/10 shrink-0"><Ic n={collapsed ? 'chevRight' : 'chevDown'} size={16}/></button>
            {name !== null ? (
              <input autoFocus value={name} onChange={e=>setName(e.target.value)} onBlur={commitName}
                onKeyDown={e=>{ if(e.key==='Enter') commitName(); if(e.key==='Escape') setName(null); }}
                className="flex-1 min-w-0 bg-white/80 dark:bg-neutral-800 rounded-lg px-2 py-1 font-display font-semibold outline-none border border-blue-300"/>
            ) : (
              <h3 onClick={()=>{ if (isMobileNow()) onToggleCollapse(); else if (cat) setName(cat.name); }} title={cat ? 'Umbenennen' : ''}
                className={`flex-1 min-w-0 truncate font-display text-[17px] font-semibold py-2 ${cat ? 'md:cursor-text' : 'text-neutral-500'}`}>{cat ? cat.name : 'Ohne Kategorie'}</h3>
            )}
            {tasks.length > 0 && <span className="text-xs font-semibold text-neutral-500 dark:text-neutral-400 tabular-nums shrink-0">{done}/{tasks.length}</span>}
            {cat && <button onClick={()=>setMenu(m=>!m)} className="w-11 h-11 md:w-9 md:h-9 flex items-center justify-center rounded-xl text-neutral-400 hover:bg-black/5 dark:hover:bg-white/10 shrink-0" title="Kategorie bearbeiten"><Ic n="dots" size={16}/></button>}
          </div>
          {menu && cat && (
            <div className="pl-5 pr-3 py-2.5 border-b border-neutral-200/60 dark:border-neutral-800 anim-slide">
              <button onClick={()=>{ setName(cat.name); setMenu(false); }} className="md:hidden flex items-center gap-1.5 min-h-[44px] text-sm font-medium text-neutral-600 dark:text-neutral-300 px-2 rounded-lg">Umbenennen</button>
              <div className="flex flex-wrap gap-3 mb-2.5">
                {CAT_COLORS.map(c => (
                  <button key={c} onClick={()=>onRecolor(cat.id, c)} className={`w-9 h-9 md:w-7 md:h-7 rounded-full transition-transform ${c===cat.color ? 'ring-2 ring-offset-2 ring-neutral-400 dark:ring-offset-neutral-900 scale-110' : ''}`} style={{ background: c }}/>
                ))}
              </div>
              <button onClick={()=>onRemove(cat.id)} className="flex items-center gap-1.5 min-h-[44px] md:min-h-0 mt-2 text-sm md:text-xs font-medium text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 px-2 py-1.5 rounded-lg transition-colors"><Ic n="trash" size={14}/> Kategorie löschen</button>
            </div>
          )}
          {!collapsed && (
          <div className="p-3 pl-4 space-y-2">
            {tasks.length === 0 && <p className="text-xs text-neutral-400 dark:text-neutral-600 text-center py-4">Noch nichts hier.</p>}
            {tasks.length > 0 && shown.length === 0 && <p className="text-xs text-neutral-400 dark:text-neutral-600 text-center py-3">Alles erledigt 🎉</p>}
            {shown.map(t => <TaskItem key={t.id} task={t} isCompleted={isDoneT(t, selectedKw)} selectedKw={selectedKw} currentKw={currentKw} accentDot="" {...taskProps}/>)}
            {!showDone && <DoneRow count={done} open={openDone} onToggle={()=>setOpenDone(o=>!o)}/>}
          </div>
          )}
          {cat && !collapsed && (
            <div className="pl-4 pr-3 py-2 bg-white/70 dark:bg-neutral-900/60 border-t border-neutral-200/60 dark:border-neutral-800 flex items-center gap-1.5">
              <button onClick={doAdd} className="w-11 h-11 md:w-auto md:h-auto md:p-1.5 flex items-center justify-center rounded-lg shrink-0" style={{ color }}><Ic n="plus" size={20}/></button>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doAdd()} onPaste={handlePaste}
                placeholder="Neue Aufgabe…" enterKeyHint="done"
                className="flex-1 bg-transparent text-sm text-neutral-700 dark:text-neutral-200 placeholder-neutral-400 dark:placeholder-neutral-600 outline-none min-w-0 py-2"/>
              <button onClick={()=>fileRef.current?.click()} title="Bild" className="w-11 h-11 md:w-auto md:h-auto md:p-2 flex items-center justify-center rounded-lg text-neutral-400 hover:text-blue-500 shrink-0"><Ic n="image" size={15}/></button>
              <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>
            </div>
          )}
        </div>
      );
    };

    const CategoryBoard = ({ categories, getGroup, selectedKw, currentKw, addTaskTo, addCategory, renameCategory, recolorCategory, removeCategory, taskProps, onlyOverdue, showDone, collapsed, toggleCollapse, filterCat }) => {
      const loose = filterCat ? [] : getGroup(null);
      const cards = categories.filter(c => !filterCat || c.id === filterCat).map(c => ({ c, list: getGroup(c.id) })).filter(x => !onlyOverdue || x.list.length);
      if (categories.length === 0 && loose.length === 0) {
        return (
          <div className="max-w-md mx-auto mt-6 sm:mt-14 bg-white dark:bg-neutral-900 rounded-2xl border border-neutral-200 dark:border-neutral-800 card-shadow p-6 anim-zoom">
            <h2 className="font-display text-xl font-semibold mb-1">Eigene Kategorien</h2>
            <p className="text-sm text-neutral-500 dark:text-neutral-400 mb-4">Lege Kategorien an, z. B. Haushalt oder Einkauf, und sortiere deine Aufgaben frei ein. Tippe einen Vorschlag an oder gib einen eigenen Namen ein.</p>
            <NewCategory onAdd={addCategory} existing={categories}/>
          </div>
        );
      }
      return (
        <div className="grid gap-3 grid-cols-1 md:grid-cols-2 xl:grid-cols-3 items-start pb-4">
          {cards.map(({ c, list }) => (
            <CategoryCard key={c.id} cat={c} tasks={list} selectedKw={selectedKw} currentKw={currentKw}
              onAdd={(text, img) => addTaskTo(c.id, text, img)} onRename={renameCategory} onRecolor={recolorCategory} onRemove={removeCategory} taskProps={taskProps}
              showDone={showDone} collapsed={collapsed.includes(c.id)} onToggleCollapse={()=>toggleCollapse(c.id)}/>
          ))}
          {loose.length > 0 && <CategoryCard cat={null} tasks={loose} selectedKw={selectedKw} currentKw={currentKw} taskProps={taskProps}
            showDone={showDone} collapsed={collapsed.includes('__none')} onToggleCollapse={()=>toggleCollapse('__none')}/>}
          {!onlyOverdue && !filterCat && (
            <div className="rounded-2xl border-2 border-dashed border-neutral-300 dark:border-neutral-700 p-4">
              <p className="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Neue Kategorie</p>
              <NewCategory onAdd={addCategory} existing={categories}/>
            </div>
          )}
        </div>
      );
    };

    // ── Schnell anlegen (fest unten): Text + Kategorie antippen + Enter ──
    const QuickAdd = ({ categories, lastCat, setLastCat, onSubmit, addCategory }) => {
      const [text, setText] = useState('');
      const [due, setDue] = useState(null);
      const [showDue, setShowDue] = useState(false);
      const [adding, setAdding] = useState(false);
      const [flash, setFlash] = useState('');
      const ref = useRef(null);
      const flashTimer = useRef(null);

      const submit = () => {
        if (!text.trim()) { ref.current?.focus(); return; }
        const p = parseQuick(text, categories);
        const cat = p.cat ?? lastCat;
        onSubmit({ text: p.text || text.trim(), cat, due: p.due || due });
        const name = categories.find(c => c.id === cat)?.name;
        setFlash(name ? `✓ ${name}` : '✓ Angelegt');
        clearTimeout(flashTimer.current); flashTimer.current = setTimeout(() => setFlash(''), 1800);
        setText(''); setDue(null);
        ref.current?.focus();
      };

      return (
        <div className="shrink-0 bg-white/95 dark:bg-neutral-900/95 backdrop-blur-md border-t border-neutral-200 dark:border-neutral-800 px-3 pt-2.5 safe-bottom pb-2.5 z-20">
          <div className="flex items-center gap-2 max-w-3xl mx-auto">
            <input ref={ref} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}
              placeholder="Was ist zu tun?" enterKeyHint="send" autoComplete="off" autoCapitalize="sentences"
              className="flex-1 min-w-0 bg-neutral-100 dark:bg-neutral-800 rounded-2xl px-4 py-3 text-[15px] text-neutral-800 dark:text-neutral-100 placeholder-neutral-400 outline-none focus:ring-2 focus:ring-blue-400/60"/>
            <button onClick={()=>setShowDue(true)} title="Zieldatum"
              className={`shrink-0 flex items-center gap-1 px-3 h-12 rounded-2xl text-sm font-medium transition-colors ${due ? 'bg-orange-100 dark:bg-orange-500/15 text-orange-600 dark:text-orange-300' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-500 dark:text-neutral-400'}`}>
              <Ic n="cal" size={18}/>{due && <span>{fmtDue(due)}</span>}
            </button>
            <button onClick={submit} title="Hinzufügen" className="shrink-0 w-12 h-12 rounded-2xl bg-blue-500 hover:bg-blue-600 active:scale-95 text-white flex items-center justify-center transition-all"><Ic n="plus" size={22} sw={2.5}/></button>
          </div>
          <div className="flex items-center gap-1.5 max-w-3xl mx-auto mt-2 overflow-x-auto no-scrollbar">
            {categories.map(c => {
              const on = lastCat === c.id;
              return (
                <button key={c.id} onClick={()=>setLastCat(on ? null : c.id)}
                  className="shrink-0 flex items-center gap-1.5 px-3.5 min-h-[44px] md:min-h-0 md:py-1.5 rounded-full text-[13px] font-medium border transition-all"
                  style={on ? { background: c.color, borderColor: c.color, color: '#fff' } : { borderColor: c.color + '66', color: 'inherit' }}>
                  {!on && <span className="w-2 h-2 rounded-full" style={{ background: c.color }}/>}{c.name}
                </button>
              );
            })}
            <button onClick={()=>setAdding(a=>!a)} className="shrink-0 px-3.5 min-h-[44px] md:min-h-0 md:py-1.5 rounded-full text-[13px] font-medium bg-neutral-100 dark:bg-neutral-800 text-neutral-500 dark:text-neutral-400">+ Neu</button>
            {flash && <span className="shrink-0 ml-1 text-xs font-medium text-emerald-600 dark:text-emerald-400 anim-fade">{flash}</span>}
          </div>
          {adding && (
            <div className="max-w-3xl mx-auto mt-2 anim-slide">
              <NewCategory autoFocus compact existing={categories} onAdd={n=>{ const id = addCategory(n); if (id) setLastCat(id); setAdding(false); ref.current?.focus(); }}/>
            </div>
          )}
          {showDue && <DueSheet value={due} onPick={setDue} onClose={()=>{ setShowDue(false); ref.current?.focus(); }}/>}
        </div>
      );
    };

    const SEARCH_META = {
      q1:{l:'Erledigen', c:'text-rose-500 bg-rose-50 dark:bg-rose-500/10'},
      q2:{l:'Einplanen', c:'text-blue-500 bg-blue-50 dark:bg-blue-500/10'},
      q3:{l:'Delegieren', c:'text-amber-500 bg-amber-50 dark:bg-amber-500/10'},
      q4:{l:'Eliminieren', c:'text-zinc-400 bg-zinc-100 dark:bg-zinc-500/10'},
    };
    const QUADS = [
      {id:'q1', subtitle:'Wichtig & Dringend', label:'Erledigen', color:'#f43f5e'},
      {id:'q2', subtitle:'Wichtig & Nicht dringend', label:'Einplanen', color:'#3b82f6'},
      {id:'q3', subtitle:'Nicht wichtig & Dringend', label:'Delegieren', color:'#f59e0b'},
      {id:'q4', subtitle:'Nicht wichtig & Nicht dringend', label:'Eliminieren', color:'#a1a1aa'},
    ];

    // ── App ────────────────────────────────────────────────────────
    function App() {
      const currentKw = getISOWeek(new Date());
      const [selectedKw, setSelectedKw] = useState(currentKw);
      const [tasks, setTasks] = useState([]);
      const [freeTasks, setFreeTasks] = useState([]);
      const [categories, setCategories] = useState([]);
      const [mode, setMode] = useState('matrix');
      const [lastCat, setLastCat] = useState(null);
      const [loaded, setLoaded] = useState(false);
      const [dark, setDark] = useState(false);
      const [view, setView] = useState('matrix');
      const [showSearch, setShowSearch] = useState(false);
      const [showBackup, setShowBackup] = useState(false);
      const [showWeeks, setShowWeeks] = useState(false);
      const [onlyOverdue, setOnlyOverdue] = useState(false);
      const [banner, setBanner] = useState(true);
      const mobile = useMobile();
      const [showDone, setShowDone] = useState(() => { const v = readLS('matrix_showdone', null); return v === null ? !isMobileNow() : !!v; });
      const [filterCat, setFilterCat] = useState(null);
      const [quadTab, setQuadTab] = useState(() => readLS('matrix_quadtab', 'q1'));
      const [collapsed, setCollapsed] = useState(() => readLS('matrix_collapsed', []));
      const [sheetId, setSheetId] = useState(null);
      const [showMenu, setShowMenu] = useState(false);
      const [notifPerm, setNotifPerm] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');
      const [, setTick] = useState(0);
      const [toasts, setToasts] = useState([]);
      const scrollRef = useRef(null);
      const allRef = useRef([]);

      const isFree = mode === 'free';
      const list = isFree ? freeTasks : tasks;
      const setList = isFree ? setFreeTasks : setTasks;
      const groupKey = isFree ? 'cat' : 'quadrant';

      useEffect(() => {
        const read = (k, fb) => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : fb; } catch { return fb; } };
        setTasks(read('matrix_tasks', []));
        setFreeTasks(read('matrix_free_tasks', []));
        setCategories(read('matrix_categories', []));
        setLastCat(read('matrix_lastcat', null));
        setMode(localStorage.getItem('matrix_mode') === 'free' ? 'free' : 'matrix');
        setDark(localStorage.getItem('matrix_dark') === 'true');
        setLoaded(true);
      }, []);
      useEffect(() => { if(loaded) saveLS('matrix_tasks', tasks); }, [tasks, loaded]);
      useEffect(() => { if(loaded) saveLS('matrix_free_tasks', freeTasks); }, [freeTasks, loaded]);
      useEffect(() => { if(loaded) saveLS('matrix_categories', categories); }, [categories, loaded]);
      useEffect(() => { if(loaded) saveLS('matrix_lastcat', lastCat); }, [lastCat, loaded]);
      useEffect(() => { if(loaded) saveLS('matrix_mode', mode); }, [mode, loaded]);
      useEffect(() => { saveLS('matrix_showdone', JSON.stringify(showDone)); }, [showDone]);
      useEffect(() => { saveLS('matrix_quadtab', JSON.stringify(quadTab)); }, [quadTab]);
      useEffect(() => { saveLS('matrix_collapsed', JSON.stringify(collapsed)); }, [collapsed]);
      useEffect(() => { setFilterCat(null); setSheetId(null); }, [mode]);
      const toggleCollapse = (id) => setCollapsed(c => c.includes(id) ? c.filter(x => x !== id) : [...c, id]);
      useEffect(() => {
        saveLS('matrix_dark', String(dark)); document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0a0a0a' : '#ffffff');
      }, [dark]);
      useEffect(() => { if(!loaded) return; const el = scrollRef.current?.querySelector(`[data-kw="${currentKw}"]`); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, [loaded]);

      const goToWeek = useCallback((w) => {
        setSelectedKw(w);
        requestAnimationFrame(() => scrollRef.current?.querySelector(`[data-kw="${w}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}));
      }, []);

      // Keyboard: ⌘K search, arrows for weeks, esc to close
      useEffect(() => {
        const fn = e => {
          if((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); setShowSearch(s=>!s); return; }
          if(e.key==='Escape') { setShowSearch(false); setShowBackup(false); setShowWeeks(false); return; }
          const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
          if(typing) return;
          if(e.key==='ArrowDown' || e.key==='ArrowRight') { e.preventDefault(); setSelectedKw(w => { const n=Math.min(52,w+1); requestAnimationFrame(()=>scrollRef.current?.querySelector(`[data-kw="${n}"]`)?.scrollIntoView({block:'nearest'})); return n; }); }
          if(e.key==='ArrowUp' || e.key==='ArrowLeft') { e.preventDefault(); setSelectedKw(w => { const n=Math.max(1,w-1); requestAnimationFrame(()=>scrollRef.current?.querySelector(`[data-kw="${n}"]`)?.scrollIntoView({block:'nearest'})); return n; }); }
        };
        window.addEventListener('keydown', fn);
        return () => window.removeEventListener('keydown', fn);
      }, []);

      const addToast = useCallback(({ message, type='default', action, actionLabel }) => {
        const id = Date.now() + Math.random();
        setToasts(t => [...t, {id, message, type, action, actionLabel}]);
        setTimeout(() => setToasts(t => t.filter(x=>x.id!==id)), 4500);
      }, []);
      const dismissToast = useCallback(id => setToasts(t=>t.filter(x=>x.id!==id)), []);

      // ── Erinnerungen (überfällige Aufgaben, beide Modi) ──
      allRef.current = [...tasks, ...freeTasks];
      const notifyOverdue = useCallback(async () => {
        if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
        const od = allRef.current.filter(isOverdue);
        if (!od.length) return;
        let st = null; try { st = JSON.parse(localStorage.getItem('matrix_notified') || 'null'); } catch {}
        const day = todayStr();
        const seen = st && st.day === day ? st.ids : [];
        const fresh = od.filter(t => !seen.includes(t.id));
        if (!fresh.length) return;
        saveLS('matrix_notified', { day, ids: [...seen, ...fresh.map(t => t.id)] });
        const title = fresh.length === 1 ? 'Aufgabe überfällig' : `${fresh.length} Aufgaben überfällig`;
        const body = fresh.slice(0,3).map(t => `• ${t.text}`).join('\n') + (fresh.length > 3 ? `\n… und ${fresh.length-3} weitere` : '');
        const opts = { body, icon: 'icon-192.png', tag: 'priomatrix-overdue' };
        try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg) { await reg.showNotification(title, opts); return; } } catch {}
        try { new Notification(title, opts); } catch {}
      }, []);
      useEffect(() => { if (loaded) notifyOverdue(); }, [loaded, tasks, freeTasks, notifPerm]);
      useEffect(() => {
        const tick = () => { setTick(x => x + 1); notifyOverdue(); };
        const iv = setInterval(tick, 15 * 60 * 1000);
        const vis = () => { if (document.visibilityState === 'visible') tick(); };
        document.addEventListener('visibilitychange', vis);
        return () => { clearInterval(iv); document.removeEventListener('visibilitychange', vis); };
      }, []);
      const enableNotifications = () => {
        if (typeof Notification === 'undefined') return;
        Notification.requestPermission().then(p => {
          setNotifPerm(p);
          addToast(p === 'granted' ? { type:'success', message:'Erinnerungen aktiviert' } : { type:'error', message:'Benachrichtigungen wurden nicht erlaubt' });
        });
      };
      useEffect(() => {
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
      }, []);

      // ── Aufgaben ──
      const addTask = (group, text, image=null, due=null) => {
        if(!text.trim() && !image) return;
        setList(prev => [...prev, { id:newId(), text:text.trim()||'Bildaufgabe', image, notes:'', [groupKey]:group, status:'todo', startKw:selectedKw, endKw:null, due:due||null }]);
      };
      const addTaskTo = (catId, text, image=null) => { const p = parseQuick(text, []); addTask(catId, p.text || text, image, p.due); };
      const quickSubmit = ({ text, cat, due }) => {
        if (cat) setLastCat(cat);
        addTask(cat, text, null, due);
      };
      const editTask = (id, newText) => setList(prev => prev.map(t => t.id===id ? {...t, text:newText} : t));
      const restoreTask = (snap) => setList(prev => [...prev, snap]);
      const updateNotes = (id, notes) => setList(prev => prev.map(t => t.id===id ? {...t, notes} : t));
      const patchTask = (id, fn) => setList(prev => prev.map(t => t.id === id ? fn(t) : t));
      const addSubs = (id, text) => {
        const lines = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
        if (lines.length) patchTask(id, t => ({ ...t, subs: [...(t.subs || []), ...lines.map(l => ({ id: newId(), text: l, done: false }))] }));
      };
      const toggleSub = (id, sid) => patchTask(id, t => ({ ...t, subs: (t.subs || []).map(x => x.id === sid ? { ...x, done: !x.done } : x) }));
      const editSub = (id, sid, text) => patchTask(id, t => ({ ...t, subs: (t.subs || []).flatMap(x => x.id !== sid ? [x] : (text.trim() ? [{ ...x, text: text.trim() }] : [])) }));
      const deleteSub = (id, sid) => patchTask(id, t => ({ ...t, subs: (t.subs || []).filter(x => x.id !== sid) }));
      const setNumbered = (id, numbered) => patchTask(id, t => ({ ...t, numbered }));
      const setDue = (id, due) => setList(prev => prev.map(t => t.id===id ? {...t, due} : t));
      const attachImageToTask = (id, img) => setList(prev => prev.map(t => t.id===id ? {...t,image:img} : t));
      const removeImage = (id) => setList(prev => prev.map(t => t.id===id ? {...t,image:null} : t));
      const toggleTask = (id) => setList(prev => {
        const next = prev.map(t => t.id!==id ? t : t.endKw===selectedKw ? {...t,endKw:null} : {...t,endKw:selectedKw});
        const week = next.filter(t => t.startKw<=selectedKw && (t.endKw===null||t.endKw>=selectedKw));
        const justCompleted = next.find(t=>t.id===id)?.endKw===selectedKw;
        if (justCompleted && week.length > 0 && week.every(t=>t.endKw!==null && t.endKw<=selectedKw)) {
          addToast({ type:'success', message:`🎉 Alle ${week.length} Aufgaben der Woche erledigt!` });
        }
        return next;
      });
      const deleteTask = (id) => setList(prev => prev.filter(t => t.id!==id));
      const moveTask = (taskId, g) => setList(prev => prev.map(t => t.id===taskId ? {...t,[groupKey]:g} : t));
      // Insert dragged task before target task (also adopts target's group)
      const reorderTask = (dragId, targetId) => setList(prev => {
        const drag = prev.find(t=>t.id===dragId);
        if (!drag || dragId===targetId) return prev;
        const rest = prev.filter(t=>t.id!==dragId);
        const idx = rest.findIndex(t=>t.id===targetId);
        if (idx < 0) return prev;
        return [...rest.slice(0,idx), {...drag, [groupKey]: rest[idx][groupKey] ?? null}, ...rest.slice(idx)];
      });
      const postponeTask = (id) => {
        const orig = list.find(t=>t.id===id)?.startKw;
        const target = Math.min(52, selectedKw+1);
        setList(prev => prev.map(t => t.id===id ? {...t, startKw: target} : t));
        addToast({ message:`Auf KW ${target} verschoben`, action:()=>setList(prev => prev.map(t => t.id===id ? {...t, startKw: orig} : t)) });
      };
      // Kanban: move a task between To Do / Doing / Done for the selected week.
      // Done syncs with the Matrix completion (endKw); leaving Done re-opens the task.
      const setKanbanStatus = (id, target) => setTasks(prev => prev.map(t => {
        if (t.id !== id) return t;
        if (target === 'done') return { ...t, endKw: selectedKw, status: 'done' };
        return { ...t, endKw: null, status: target };
      }));

      // ── Kategorien ──
      const addCategory = (name) => {
        if (categories.some(c => c.name.toLowerCase() === name.toLowerCase())) { addToast({ type:'error', message:`„${name}" gibt es schon` }); return null; }
        const id = newId();
        setCategories(prev => [...prev, { id, name, color: CAT_COLORS[prev.length % CAT_COLORS.length] }]);
        return id;
      };
      const renameCategory = (id, name) => setCategories(prev => prev.map(c => c.id===id ? {...c, name} : c));
      const recolorCategory = (id, color) => setCategories(prev => prev.map(c => c.id===id ? {...c, color} : c));
      const removeCategory = (id) => {
        const idx = categories.findIndex(c => c.id===id); if (idx < 0) return;
        const snap = categories[idx];
        const affected = freeTasks.filter(t => t.cat===id).map(t => t.id);
        setCategories(prev => prev.filter(c => c.id!==id));
        setFreeTasks(prev => prev.map(t => t.cat===id ? {...t, cat:null} : t));
        if (lastCat === id) setLastCat(null);
        addToast({ message:`„${snap.name}" gelöscht`, action:()=>{
          setCategories(prev => { const n = [...prev]; n.splice(Math.min(idx, n.length), 0, snap); return n; });
          setFreeTasks(prev => prev.map(t => affected.includes(t.id) ? {...t, cat:id} : t));
        }});
      };

      const importData = (p) => {
        if (p.tasks) setTasks(p.tasks);
        if (p.freeTasks) setFreeTasks(p.freeTasks);
        if (p.categories) setCategories(p.categories);
      };

      const catIds = new Set(categories.map(c => c.id));
      const inWeek = t => t.startKw<=selectedKw && (t.endKw===null || t.endKw>=selectedKw);
      const getGroup = (gid) => list
        .filter(t => (isFree ? (gid===null ? !catIds.has(t.cat) : t.cat===gid) : t.quadrant===gid) && (onlyOverdue ? isOverdue(t) : inWeek(t)))
        .map((t, i) => ({ t, i }))
        .sort((a, b) => {
          const doneA = a.t.endKw!==null && a.t.endKw<=selectedKw ? 1 : 0;
          const doneB = b.t.endKw!==null && b.t.endKw<=selectedKw ? 1 : 0;
          return doneA - doneB || a.i - b.i;
        })
        .map(({ t }) => t);

      const overdueCount = list.filter(isOverdue).length;
      useEffect(() => { if (overdueCount === 0) setOnlyOverdue(false); }, [overdueCount]);
      useEffect(() => { setOnlyOverdue(false); }, [mode]);

      const weekTasks = list.filter(inWeek);
      const doneInView = weekTasks.filter(t => isDoneT(t, selectedKw)).length;
      const doneCount = list.filter(t=>t.endKw===selectedKw).length;
      const openCount = weekTasks.length - doneCount;
      const weekPct = weekTasks.length ? doneCount / weekTasks.length : 0;

      const groups = isFree
        ? [...categories.map(c => ({ id:c.id, label:c.name, color:c.color })), { id:null, label:'Ohne Kategorie', color:'#a1a1aa' }]
        : QUADS.map(q => ({ id:q.id, short:q.label, label:`${q.label} · ${q.subtitle}`, color:q.color }));
      const tagOf = (t) => { const g = groups.find(g => g.id === (t[groupKey] ?? null)); return g ? { label: g.short || g.label, color: g.color } : null; };
      const today = todayStr();
      const todayTasks = list.filter(t => t.endKw === null && t.due && t.due <= today).sort((a, b) => a.due.localeCompare(b.due));
      const openIn = (gid) => getGroup(gid).filter(t => !isDoneT(t, selectedKw)).length;
      const effFilter = mobile ? filterCat : null;
      const sheetTask = sheetId ? list.find(t => t.id === sheetId) : null;
      const metaOf = (t) => {
        if (!isFree) return SEARCH_META[t.quadrant];
        const c = categories.find(c => c.id===t.cat);
        return c ? { l:c.name, c:'bg-neutral-100 dark:bg-neutral-800', style:{ color:c.color } } : { l:'Ohne Kategorie', c:'text-neutral-400 bg-neutral-100 dark:bg-neutral-800' };
      };

      const taskProps = { toggleTask, deleteTask, attachImageToTask, removeImage, moveTask, editTask, updateNotes, addToast, reorderTask, restoreTask, postponeTask, setDue, groups, groupKey, mobile, openSheet: setSheetId, addSubs, toggleSub, editSub, deleteSub };

      const btnGhost = "w-10 h-10 md:w-auto md:h-auto flex items-center justify-center md:p-2 text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 rounded-xl transition-colors";
      const segBtn = (on) => `flex-1 md:flex-none flex items-center justify-center gap-1.5 px-3 min-h-[40px] md:min-h-0 md:py-1.5 rounded-[10px] text-sm font-medium transition-all ${on ? 'bg-white dark:bg-neutral-700 text-neutral-800 dark:text-neutral-100 shadow-sm' : 'text-neutral-500 dark:text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-200'}`;

      return (
        <div className="flex app-root bg-neutral-100 dark:bg-neutral-950 overflow-hidden text-neutral-800 dark:text-neutral-100">
          <div className="flex-1 flex flex-col overflow-hidden min-w-0">

            {/* Header */}
            <header className="shrink-0 bg-white/80 dark:bg-neutral-900/80 backdrop-blur-md border-b border-neutral-200 dark:border-neutral-800 px-3 sm:px-5 py-2 sm:py-2.5 safe-top flex flex-wrap items-center gap-x-3 gap-y-2 z-20">
              <div className="hidden min-[420px]:flex items-center gap-2.5 shrink-0">
                <Logo size={28}/>
                <span className="hidden sm:inline font-display font-bold text-lg tracking-tight text-neutral-900 dark:text-white">Prio<span className="text-blue-500">Matrix</span></span>
              </div>

              <div className="hidden md:block w-px h-6 bg-neutral-200 dark:bg-neutral-700 shrink-0"/>

              {/* Woche: Desktop */}
              <button onClick={()=>goToWeek(currentKw)} className="hidden md:flex items-center gap-2 shrink-0 group" title="Zur aktuellen Woche">
                <Ic n="cal" size={15} cls="text-neutral-400"/>
                <span className="font-display font-semibold text-neutral-800 dark:text-neutral-100">KW {selectedKw}</span>
                <span className="text-xs text-neutral-400 hidden lg:inline">{weekDateRange(selectedKw)}</span>
                {selectedKw===currentKw
                  ? <span className="text-[11px] px-2 py-0.5 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full font-medium">Aktuell</span>
                  : <span className="text-[11px] px-2 py-0.5 bg-neutral-100 dark:bg-neutral-800 text-neutral-500 rounded-full font-medium group-hover:bg-neutral-200 dark:group-hover:bg-neutral-700 transition-colors">→ KW {currentKw}</span>}
              </button>

              {/* Woche: Handy (Pfeile + Wochenliste als Schublade) */}
              <div className="flex md:hidden items-center shrink-0">
                <button onClick={()=>goToWeek(Math.max(1,selectedKw-1))} className={btnGhost} aria-label="Vorherige Woche"><Ic n="chevLeft" size={16}/></button>
                <button onClick={()=>setShowWeeks(true)} className="flex flex-col items-center justify-center h-10 leading-tight px-1 min-w-[64px]">
                  <span className="font-display font-semibold text-sm">KW {selectedKw}</span>
                  <span className={`text-[10px] ${selectedKw===currentKw ? 'text-blue-500 font-medium' : 'text-neutral-400'}`}>{selectedKw===currentKw ? 'Aktuell' : weekDateRange(selectedKw)}</span>
                </button>
                <button onClick={()=>goToWeek(Math.min(52,selectedKw+1))} className={btnGhost} aria-label="Nächste Woche"><Ic n="chevRight" size={16}/></button>
              </div>

              <div className="hidden md:block w-px h-6 bg-neutral-200 dark:bg-neutral-700 shrink-0"/>

              {/* Modus + Ansicht */}
              <div className="order-last w-full md:order-none md:w-auto flex items-center gap-2">
                <div className="flex flex-1 md:flex-none items-center gap-0.5 bg-neutral-100 dark:bg-neutral-800 rounded-xl p-0.5">
                  <button onClick={()=>setMode('matrix')} className={segBtn(!isFree)}>Matrix</button>
                  <button onClick={()=>setMode('free')} className={segBtn(isFree)}>Kategorien</button>
                </div>
                {!isFree && (
                  <div className="flex items-center gap-0.5 bg-neutral-100 dark:bg-neutral-800 rounded-xl p-0.5 shrink-0">
                    {[{k:'matrix',l:'Raster'},{k:'kanban',l:'Kanban'}].map(tab => (
                      <button key={tab.k} onClick={()=>setView(tab.k)} className={segBtn(view===tab.k)}>{tab.l}</button>
                    ))}
                  </div>
                )}
              </div>

              <div className="flex-1"/>

              {weekTasks.length > 0 && (
                <div className="hidden sm:flex items-center gap-3 mr-1">
                  <div className="text-right">
                    <p className="text-xs leading-tight">
                      <span className="font-semibold text-neutral-700 dark:text-neutral-200 tabular-nums">{openCount}</span>
                      <span className="text-neutral-400"> offen</span>
                      {doneCount>0 && <span className="text-emerald-600 dark:text-emerald-400 font-medium tabular-nums"> · {doneCount} erledigt</span>}
                    </p>
                    <p className="text-[10px] text-neutral-400 uppercase tracking-wider">Woche {selectedKw}</p>
                  </div>
                  <Ring pct={weekPct} size={38}/>
                </div>
              )}

              <div className="flex items-center gap-1">
                {overdueCount > 0 && (
                  <button onClick={()=>setOnlyOverdue(o=>!o)} title="Überfällige Aufgaben"
                    className={`flex items-center gap-1 px-2.5 h-10 md:h-auto md:py-1.5 rounded-xl text-sm font-semibold tabular-nums transition-colors ${onlyOverdue ? 'bg-rose-500 text-white' : 'bg-rose-50 dark:bg-rose-500/15 text-rose-600 dark:text-rose-400'}`}>
                    <Ic n="alert" size={14}/>{overdueCount}
                  </button>
                )}
                {notifPerm === 'default' && (
                  <button onClick={enableNotifications} title="Erinnerungen aktivieren" className={`${btnGhost} hidden md:flex`}><Ic n="bell" size={15}/></button>
                )}
                {doneInView > 0 && (
                  <button onClick={()=>setShowDone(d=>!d)} title={showDone ? 'Erledigte ausblenden' : 'Erledigte anzeigen'}
                    className={`h-10 md:h-auto min-w-[40px] flex items-center justify-center gap-1 px-2 md:px-2.5 md:py-2 rounded-xl text-sm transition-colors ${showDone ? 'bg-emerald-50 dark:bg-emerald-500/15 text-emerald-600 dark:text-emerald-400' : 'text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800'}`}>
                    <Ic n="check" size={16}/>{!showDone && <span className="text-xs font-semibold tabular-nums">{doneInView}</span>}
                  </button>
                )}
                <button onClick={()=>setShowSearch(true)} title="Suchen (⌘K)"
                  className="w-10 h-10 md:w-auto md:h-auto justify-center flex items-center gap-1.5 md:px-2.5 md:py-1.5 text-sm text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 rounded-xl transition-colors">
                  <Ic n="search" size={15}/>
                  <kbd className="hidden md:inline text-[11px] bg-neutral-100 dark:bg-neutral-800 px-1.5 py-0.5 rounded-md font-mono text-neutral-400">⌘K</kbd>
                </button>
                <button onClick={()=>setShowBackup(true)} title="Backup & Daten" className={`${btnGhost} hidden md:flex`}><Ic n="db" size={15}/></button>
                <button onClick={()=>setDark(d=>!d)} title={dark?'Heller Modus':'Dunkler Modus'} className={`${btnGhost} hidden md:flex`}><Ic n={dark?'sun':'moon'} size={15}/></button>
                <button onClick={()=>setShowMenu(true)} aria-label="Menü" className={`${btnGhost} md:hidden`}><Ic n="dots" size={18}/></button>
              </div>
            </header>

            {/* Erinnerungs-Leiste */}
            {onlyOverdue ? (
              <div className="shrink-0 flex items-center gap-2 px-4 py-2 bg-rose-50 dark:bg-rose-500/10 text-rose-700 dark:text-rose-300 text-sm anim-slide">
                <Ic n="alert" size={15}/><span className="flex-1">Nur überfällige Aufgaben ({overdueCount})</span>
                <button onClick={()=>setOnlyOverdue(false)} className="font-semibold underline underline-offset-2 min-h-[44px] md:min-h-0 px-1">Alle zeigen</button>
              </div>
            ) : banner && overdueCount > 0 && (
              <div className="shrink-0 flex items-center gap-2 px-4 py-2 bg-rose-50 dark:bg-rose-500/10 text-rose-700 dark:text-rose-300 text-sm anim-slide">
                <Ic n="alert" size={15} cls="shrink-0"/>
                <span className="flex-1 min-w-0">{overdueCount === 1 ? '1 Aufgabe ist überfällig' : `${overdueCount} Aufgaben sind überfällig`}</span>
                {notifPerm === 'default' && <button onClick={enableNotifications} className="font-semibold underline underline-offset-2 shrink-0 min-h-[44px] md:min-h-0 px-1">Erinnern</button>}
                <button onClick={()=>setOnlyOverdue(true)} className="font-semibold underline underline-offset-2 shrink-0 min-h-[44px] md:min-h-0 px-1">Anzeigen</button>
                <button onClick={()=>setBanner(false)} aria-label="Schließen" className="w-11 h-11 md:w-auto md:h-auto md:p-1 flex items-center justify-center -mr-2 shrink-0 opacity-60 hover:opacity-100"><Ic n="x" size={14}/></button>
              </div>
            )}

            {/* Handy: Kategorie-Filter bzw. Quadrant-Tabs */}
            {mobile && ((isFree && categories.length > 0) || (!isFree && view === 'matrix')) && (
              <div className="shrink-0 flex items-center gap-1.5 px-3 py-2 overflow-x-auto no-scrollbar bg-white/60 dark:bg-neutral-900/60 border-b border-neutral-200/70 dark:border-neutral-800">
                {(() => {
                  const cur = isFree ? (filterCat || 'all') : quadTab;
                  const pick = isFree ? (v => setFilterCat(v === 'all' ? null : v)) : setQuadTab;
                  const chipCls = on => `shrink-0 flex items-center gap-1.5 px-3.5 min-h-[44px] rounded-full text-[13px] font-medium border transition-colors ${on ? 'bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 border-transparent' : 'border-neutral-200 dark:border-neutral-700 text-neutral-600 dark:text-neutral-300'}`;
                  const items = [
                    ...(isFree ? [{ id:'all', label:'Alle', n: list.filter(t => inWeek(t) && !isDoneT(t, selectedKw)).length }] : []),
                    { id:'today', label:'Heute', n: todayTasks.length, color:'#f97316' },
                    ...(isFree ? categories.map(c => ({ id:c.id, label:c.name, color:c.color, n: openIn(c.id) })) : QUADS.map(q => ({ id:q.id, label:q.label, color:q.color, n: openIn(q.id) }))),
                  ];
                  return items.map(it => (
                    <button key={it.id} onClick={()=>pick(it.id)} className={chipCls(cur === it.id)}>
                      {it.color && <span className="w-2 h-2 rounded-full" style={{ background: it.color }}/>}{it.label}
                      <span className={`text-[11px] tabular-nums ${cur === it.id ? 'opacity-70' : 'text-neutral-400'}`}>{it.n}</span>
                    </button>
                  ));
                })()}
              </div>
            )}

            {/* Board / Matrix / Kanban */}
            <main className={`flex-1 overflow-y-auto ${isFree ? '' : 'md:overflow-hidden'} dot-grid p-3 md:p-4`}>
              {mobile && ((isFree && effFilter === 'today') || (!isFree && view === 'matrix' && quadTab === 'today')) ? (
                <TodayList tasks={todayTasks} tagOf={tagOf} taskProps={taskProps} selectedKw={selectedKw}/>
              ) : isFree ? (
                <CategoryBoard categories={categories} getGroup={getGroup} selectedKw={selectedKw} currentKw={currentKw}
                  addTaskTo={addTaskTo} addCategory={addCategory} renameCategory={renameCategory} recolorCategory={recolorCategory} removeCategory={removeCategory}
                  taskProps={taskProps} onlyOverdue={onlyOverdue}
                  showDone={showDone} collapsed={collapsed} toggleCollapse={toggleCollapse} filterCat={effFilter}/>
              ) : view === 'matrix' ? (
                <div className="md:h-full flex gap-2">
                  {/* Vertical axis: Wichtigkeit */}
                  <div className="hidden md:flex flex-col items-center justify-between py-1 shrink-0 w-6 text-[10px] font-semibold uppercase tracking-widest text-neutral-400 dark:text-neutral-600">
                    <div className="flex items-center gap-1 text-rose-400 dark:text-rose-500"><Ic n="chevUp" size={12}/></div>
                    <span className="vert-text font-display tracking-[0.25em] text-neutral-500 dark:text-neutral-400">WICHTIGKEIT</span>
                    <div className="h-4"/>
                  </div>

                  <div className="flex-1 flex flex-col gap-2 min-w-0">
                    {/* Horizontal axis: Dringlichkeit */}
                    <div className="hidden md:flex items-center justify-center gap-2 shrink-0 text-[10px] font-semibold uppercase tracking-widest text-neutral-400 dark:text-neutral-600">
                      <span className="font-display tracking-[0.25em] text-neutral-500 dark:text-neutral-400">DRINGLICHKEIT</span>
                      <Ic n="arrowRight" size={12} cls="text-rose-400 dark:text-rose-500"/>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:flex-1 md:min-h-0">
                      {QUADS.filter(q => !mobile || quadTab === q.id).map(q => (
                        <Quadrant key={q.id} id={q.id} subtitle={q.subtitle} tasks={getGroup(q.id)} selectedKw={selectedKw} currentKw={currentKw} addTask={addTask} showDone={showDone} {...taskProps}/>
                      ))}
                    </div>
                  </div>
                </div>
              ) : (
                <KanbanBoard tasks={tasks} selectedKw={selectedKw} setKanbanStatus={setKanbanStatus}
                  deleteTask={deleteTask} restoreTask={restoreTask} addToast={addToast} updateNotes={updateNotes}/>
              )}
            </main>

            {isFree && <QuickAdd categories={categories} lastCat={lastCat} setLastCat={setLastCat} onSubmit={quickSubmit} addCategory={addCategory}/>}
          </div>

          {showWeeks && <div className="fixed inset-0 z-30 bg-black/40 md:hidden anim-fade" onClick={()=>setShowWeeks(false)}/>}
          <WeekSidebar selectedKw={selectedKw} currentKw={currentKw} tasks={list} scrollRef={scrollRef}
            onSelect={w=>{ goToWeek(w); setShowWeeks(false); }} onClose={()=>setShowWeeks(false)}
            className={`${showWeeks ? 'fixed inset-y-0 right-0 z-40 flex shadow-2xl' : 'hidden'} md:static md:flex md:shadow-none md:z-auto`}/>

          {showSearch && <SearchOverlay tasks={list} metaOf={metaOf} onClose={()=>setShowSearch(false)} onJump={t=>{ goToWeek(t.startKw); setShowSearch(false); }}/>}
          {showBackup && <BackupPanel mode={mode} tasks={tasks} freeTasks={freeTasks} categories={categories} onImport={importData} onClose={()=>setShowBackup(false)} addToast={addToast} selectedKw={selectedKw}/>}
          {showMenu && <MenuSheet dark={dark} setDark={setDark} notifPerm={notifPerm} enableNotifications={enableNotifications} openBackup={()=>setShowBackup(true)} onClose={()=>setShowMenu(false)}/>}
          {sheetTask && <TaskSheet key={sheetTask.id} task={sheetTask} groups={groups} groupKey={groupKey} selectedKw={selectedKw} onClose={()=>setSheetId(null)}
            addSubs={addSubs} toggleSub={toggleSub} editSub={editSub} deleteSub={deleteSub} setNumbered={setNumbered}
            editTask={editTask} updateNotes={updateNotes} setDue={setDue} moveTask={moveTask} toggleTask={toggleTask} postponeTask={postponeTask}
            deleteTask={deleteTask} restoreTask={restoreTask} addToast={addToast} attachImageToTask={attachImageToTask} removeImage={removeImage}/>}
          <Toast toasts={toasts} dismiss={dismissToast} lift={isFree}/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
