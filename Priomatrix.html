<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PrioMatrix">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>PrioMatrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          display: ['"Space Grotesk"', 'Inter', 'sans-serif'],
        }
      }}
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { font-feature-settings: "cv02","cv03","cv04","cv11"; height: 100%; overscroll-behavior: none; }
    .app-root { height: 100vh; height: 100dvh; }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    /* Touch-Geräte: Aktionen immer sichtbar, größere Tippflächen */
    @media (pointer: coarse) {
      .act-row { opacity: 1 !important; }
      .act-row button { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
      .chk { padding: 0.25rem; margin: -0.25rem; }
    }
    /* iOS zoomt bei Eingabefeldern < 16px */
    @media (max-width: 767px) { input, textarea, select { font-size: 16px !important; } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,100,120,0.18); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100,100,120,0.32); }

    .dot-grid {
      background-image: radial-gradient(circle, rgba(30,30,50,0.05) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .dark .dot-grid {
      background-image: radial-gradient(circle, rgba(200,210,255,0.04) 1px, transparent 1px);
    }
    .vert-text { writing-mode: vertical-rl; transform: rotate(180deg); }

    @keyframes slideIn { from { transform: translateY(7px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(18px) scale(.97); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .anim-slide { animation: slideIn 0.2s cubic-bezier(.2,.8,.3,1); }
    .anim-toast { animation: slideUp 0.28s cubic-bezier(.2,.8,.3,1); }
    .anim-fade { animation: fadeIn 0.16s ease-out; }
    .anim-zoom { animation: zoomIn 0.22s cubic-bezier(.2,.8,.3,1); }
    .anim-pop { animation: pop 0.4s ease-out; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lightbox-img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 14px; box-shadow: 0 30px 70px rgba(0,0,0,0.55); }
    .card-shadow { box-shadow: 0 1px 2px rgba(20,20,40,0.04), 0 6px 16px -8px rgba(20,20,40,0.12); }
    .dark .card-shadow { box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.6); }
  </style>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ── Icons ──────────────────────────────────────────────────────
    const PATHS = {
      check: ["M22 11.08V12a10 10 0 1 1-5.93-9.14","M22 4 12 14.01 9 11.01"],
      circle: "M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z",
      plus: "M12 5v14M5 12h14",
      trash: ["M3 6h18","M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2","M10 11v6M14 11v6"],
      cal: ["M8 2v4M16 2v4M3 10h18","M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z","M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"],
      arrow: "M19 12H5m7 7-7-7 7-7",
      image: ["M21 9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10","M13 4h5v5","M13 4l5 5","M9 15l3-3 3 3"],
      x: "M18 6 6 18M6 6l12 12",
      dl: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
      ul: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
      moon: "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z",
      sun: ["M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42","M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"],
      search: ["M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z","M21 21l-4.35-4.35"],
      note: ["M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z","M14 2v6h6","M16 13H8M16 17H8M10 9H8"],
      db: ["M12 2C6.48 2 2 4.24 2 7s4.48 5 10 5 10-2.24 10-5-4.48-5-10-5z","M2 7v5c0 2.76 4.48 5 10 5s10-2.24 10-5V7","M2 12v5c0 2.76 4.48 5 10 5s10-2.24 10-5v-5"],
      bolt: "M13 2 3 14h9l-1 8 10-12h-9l1-8z",
      arrowUp: "M12 19V5M5 12l7-7 7 7",
      arrowRight: "M5 12h14M12 5l7 7-7 7",
      chevUp: "M18 15l-6-6-6 6",
      chevDown: "M6 9l6 6 6-6",
      tag: ["M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z","M7 7h.01"],
      bell: ["M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9","M13.73 21a2 2 0 0 1-3.46 0"],
      alert: ["M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z","M12 9v4M12 17h.01"],
      chevLeft: "M15 18l-6-6 6-6",
      chevRight: "M9 18l6-6-6-6",
      dots: ["M12 12h.01","M19 12h.01","M5 12h.01"],
    };
    const Ic = ({ n, size = 16, cls = "", sw = 2 }) => {
      const d = PATHS[n]; if (!d) return null;
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={cls}>
          {Array.isArray(d) ? d.map((p,i) => <path key={i} d={p}/>) : <path d={d}/>}
        </svg>
      );
    };

    // Brand logo — a 2×2 priority matrix glyph
    const Logo = ({ size = 30 }) => (
      <svg width={size} height={size} viewBox="0 0 32 32" className="shrink-0">
        <rect x="2" y="2" width="13" height="13" rx="3.5" fill="#f43f5e"/>
        <rect x="17" y="2" width="13" height="13" rx="3.5" fill="#3b82f6"/>
        <rect x="2" y="17" width="13" height="13" rx="3.5" fill="#f59e0b"/>
        <rect x="17" y="17" width="13" height="13" rx="3.5" fill="#a1a1aa"/>
      </svg>
    );

    // ── Utils ──────────────────────────────────────────────────────
    const getISOWeek = (date) => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const day = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - day);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    };

    // Date range (Mon–Sun) for an ISO week of the current year
    const weekDateRange = (week, year = new Date().getFullYear()) => {
      const simple = new Date(year, 0, 1 + (week - 1) * 7);
      const dow = simple.getDay();
      const monday = new Date(simple);
      monday.setDate(simple.getDate() - ((dow + 6) % 7));
      const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
      const f = d => `${d.getDate()}.${d.getMonth() + 1}.`;
      return `${f(monday)} – ${f(sunday)}`;
    };

    const resizeImage = (file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX = 700; let { width, height } = img;
          if (width > MAX || height > MAX) {
            if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
            else { width = Math.round(width * MAX / height); height = MAX; }
          }
          const c = document.createElement('canvas');
          c.width = width; c.height = height;
          c.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ── Datum (Zieldatum als lokaler 'YYYY-MM-DD'-String) ──────────
    const pad2 = n => String(n).padStart(2, '0');
    const dateStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const todayStr = () => dateStr(new Date());
    const addDays = (str, n) => { const [y,m,d] = str.split('-').map(Number); return dateStr(new Date(y, m-1, d+n)); };
    const dayDiff = (a, b) => { const f = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); }; return Math.round((f(a)-f(b))/86400000); };
    const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
    const fmtDue = (str) => {
      const diff = dayDiff(str, todayStr());
      if (diff === 0) return 'Heute';
      if (diff === 1) return 'Morgen';
      if (diff === -1) return 'Gestern';
      const [y,m,d] = str.split('-').map(Number);
      const wd = WD[new Date(y, m-1, d).getDay()];
      return `${wd}, ${d}.${m}.` + (y !== new Date().getFullYear() ? y : '');
    };
    // Überfällig = Zieldatum in der Vergangenheit und noch nicht erledigt
    const isOverdue = (t) => !!t.due && t.endKw === null && t.due < todayStr();
    const nextMonday = () => { const t = todayStr(); const [y,m,d] = t.split('-').map(Number); const dow = new Date(y,m-1,d).getDay() || 7; return addDays(t, 8 - dow); };

    // Kürzel im Text: "#haushalt" wählt die Kategorie, "!morgen" / "!fr" das Zieldatum
    const WD_ALIAS = { so:0, sonntag:0, mo:1, montag:1, di:2, dienstag:2, mi:3, mittwoch:3, do:4, donnerstag:4, fr:5, freitag:5, sa:6, samstag:6 };
    const parseDueWord = (w) => {
      w = w.toLowerCase();
      if (w === 'heute') return todayStr();
      if (w === 'morgen') return addDays(todayStr(), 1);
      if (w === 'übermorgen' || w === 'uebermorgen') return addDays(todayStr(), 2);
      if (w in WD_ALIAS) {
        const t = todayStr(); const [y,m,d] = t.split('-').map(Number);
        const diff = (WD_ALIAS[w] - new Date(y,m-1,d).getDay() + 7) % 7 || 7;
        return addDays(t, diff);
      }
      return null;
    };
    const parseQuick = (raw, categories) => {
      let cat = null, due = null;
      const words = raw.split(/\s+/).filter(Boolean).filter(w => {
        if (w.length > 1 && w[0] === '#') {
          const q = w.slice(1).toLowerCase();
          const hit = categories.find(c => c.name.toLowerCase().replace(/\s+/g,'') === q)
                   || (categories.filter(c => c.name.toLowerCase().startsWith(q)).length === 1 ? categories.find(c => c.name.toLowerCase().startsWith(q)) : null);
          if (hit) { cat = hit.id; return false; }
        }
        if (w.length > 1 && w[0] === '!') { const d = parseDueWord(w.slice(1)); if (d) { due = d; return false; } }
        return true;
      });
      return { text: words.join(' '), cat, due };
    };

    const MOBILE_Q = '(max-width: 767px)';
    const isMobileNow = () => typeof matchMedia === 'function' && matchMedia(MOBILE_Q).matches;
    const useMobile = () => {
      const [m, setM] = useState(isMobileNow);
      useEffect(() => {
        const mq = matchMedia(MOBILE_Q); const f = () => setM(mq.matches);
        mq.addEventListener('change', f); return () => mq.removeEventListener('change', f);
      }, []);
      return m;
    };
    const isDoneT = (t, kw) => t.endKw !== null && t.endKw <= kw;
    const readLS = (k, fb) => { try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch { return fb; } };

    const CAT_COLORS = ['#f43f5e','#f97316','#f59e0b','#10b981','#14b8a6','#3b82f6','#6366f1','#8b5cf6','#ec4899','#71717a'];
    const CAT_SUGGEST = ['Haushalt','Gartenarbeit','Einkauf','Arbeit','Familie','Termine'];
    const newId = () => Date.now().toString() + Math.random().toString(36).slice(2,6);
    const saveLS = (k, v) => { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch {} };

    const fmtBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(2) + ' MB';
    const storageSize = () => { try { return ['matrix_tasks','matrix_free_tasks','matrix_categories'].reduce((n,k) => n + new Blob([localStorage.getItem(k)||'']).size, 0); } catch { return 0; } };

    // ── Progress Ring ──────────────────────────────────────────────
    const Ring = ({ pct, size = 36, stroke = 3.5 }) => {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const done = pct >= 1;
      return (
        <div className="relative shrink-0" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="-rotate-90">
            <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={stroke}
              className="stroke-neutral-200 dark:stroke-neutral-700"/>
            <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={stroke} strokeLinecap="round"
              className={done ? 'stroke-emerald-500' : 'stroke-blue-500'}
              strokeDasharray={c} strokeDashoffset={c * (1 - pct)}
              style={{ transition: 'stroke-dashoffset .5s cubic-bezier(.2,.8,.3,1)' }}/>
          </svg>
          <span className="absolute inset-0 flex items-center justify-center text-[10px] font-semibold font-display text-neutral-600 dark:text-neutral-300">
            {Math.round(pct * 100)}
          </span>
        </div>
      );
    };

    // ── Toast ──────────────────────────────────────────────────────
    const Toast = ({ toasts, dismiss, lift }) => (
      <div style={{ bottom: lift ? 'calc(9.5rem + env(safe-area-inset-bottom))' : 'calc(1.5rem + env(safe-area-inset-bottom))' }} className="fixed left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none">
        {toasts.map(t => (
          <div key={t.id} className={`anim-toast flex items-center gap-3 pl-4 pr-3 py-2.5 rounded-2xl shadow-2xl text-sm font-medium pointer-events-auto backdrop-blur
            ${t.type==='error' ? 'bg-rose-600/95 text-white' : t.type==='success' ? 'bg-emerald-600/95 text-white' : 'bg-neutral-900/95 dark:bg-white/95 text-white dark:text-neutral-900'}`}>
            <span>{t.message}</span>
            {t.action && (
              <button onClick={() => { t.action(); dismiss(t.id); }}
                className="font-semibold px-2 py-1 rounded-lg bg-white/15 dark:bg-black/10 hover:bg-white/25 transition-colors">
                {t.actionLabel || 'Rückgängig'}
              </button>
            )}
          </div>
        ))}
      </div>
    );

    // ── Lightbox ───────────────────────────────────────────────────
    const Lightbox = ({ src, onClose }) => {
      useEffect(() => {
        const fn = e => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', fn);
        return () => window.removeEventListener('keydown', fn);
      }, []);
      return (
        <div className="fixed inset-0 z-[200] bg-black/85 backdrop-blur-sm anim-fade flex items-center justify-center p-4 cursor-zoom-out" onClick={onClose}>
          <img src={src} className="lightbox-img anim-zoom" onClick={e=>e.stopPropagation()}/>
          <button onClick={onClose} className="absolute top-4 right-4 p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
            <Ic n="x" size={20}/>
          </button>
        </div>
      );
    };

    // ── Search Overlay ─────────────────────────────────────────────
    const SearchOverlay = ({ tasks, onClose, onJump, metaOf }) => {
      const [q, setQ] = useState('');
      const ref = useRef(null);
      useEffect(() => { ref.current?.focus(); }, []);
      const results = useMemo(() => {
        if (!q.trim()) return [];
        const lq = q.toLowerCase();
        return tasks.filter(t => t.text.toLowerCase().includes(lq) || (t.notes||'').toLowerCase().includes(lq) || (t.subs||[]).some(x => x.text.toLowerCase().includes(lq))).slice(0, 50);
      }, [q, tasks]);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm anim-fade flex items-start justify-center pt-16 sm:pt-24 px-4" onClick={onClose}>
          <div className="bg-white dark:bg-neutral-900 rounded-2xl shadow-2xl w-full max-w-lg border border-neutral-200 dark:border-neutral-700 overflow-hidden anim-zoom" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center gap-3 px-4 py-3.5 border-b border-neutral-100 dark:border-neutral-800">
              <Ic n="search" size={17} cls="text-neutral-400 shrink-0"/>
              <input ref={ref} value={q} onChange={e=>setQ(e.target.value)} placeholder="Aufgaben & Notizen durchsuchen…"
                className="flex-1 bg-transparent outline-none text-neutral-800 dark:text-neutral-100 placeholder-neutral-400 text-sm"
                onKeyDown={e=>e.key==='Escape'&&onClose()}/>
              <kbd className="text-xs text-neutral-400 bg-neutral-100 dark:bg-neutral-800 px-2 py-0.5 rounded-lg font-mono">ESC</kbd>
            </div>
            <div className="max-h-80 overflow-y-auto">
              {q.trim() && results.length === 0 && <div className="py-12 text-center text-sm text-neutral-400">Keine Treffer für „{q}"</div>}
              {!q.trim() && (
                <div className="py-12 text-center text-sm text-neutral-400">
                  <Ic n="search" size={24} cls="mx-auto mb-2 opacity-25"/>Tippen, um zu suchen…
                </div>
              )}
              {results.map(t => { const m = metaOf(t); return (
                <button key={t.id} onClick={()=>onJump(t)}
                  className="w-full flex items-center gap-3 px-4 py-3 hover:bg-neutral-50 dark:hover:bg-neutral-800 text-left border-b border-neutral-100 dark:border-neutral-800 last:border-0 transition-colors">
                  <span className={`text-xs font-semibold px-2 py-1 rounded-lg shrink-0 max-w-[40%] truncate ${m.c||''}`} style={m.style}>{m.l}</span>
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm text-neutral-700 dark:text-neutral-200 truncate ${t.endKw?'line-through opacity-40':''}`}>{t.text}</p>
                    {t.notes && <p className="text-xs text-neutral-400 truncate mt-0.5">{t.notes}</p>}
                  </div>
                  <span className="text-xs text-neutral-400 shrink-0 font-medium">KW {t.startKw}</span>
                </button>
              ); })}
            </div>
          </div>
        </div>
      );
    };

    // ── Backup Panel ───────────────────────────────────────────────
    const BackupPanel = ({ mode, tasks, freeTasks, categories, onImport, onClose, addToast, selectedKw }) => {
      const fileRef = useRef(null);
      const sz = storageSize();
      const total = tasks.length + freeTasks.length;
      const doMarkdown = () => {
        const inWeek = list => list.filter(t => t.startKw<=selectedKw && (t.endKw===null||t.endKw>=selectedKw));
        const names = { q1:'Wichtig & Dringend — Erledigen', q2:'Wichtig & Nicht dringend — Einplanen', q3:'Nicht wichtig & Dringend — Delegieren', q4:'Nicht wichtig & Nicht dringend — Eliminieren' };
        const groups = mode === 'matrix'
          ? ['q1','q2','q3','q4'].map(q => ({ name: names[q], list: inWeek(tasks).filter(t=>t.quadrant===q) }))
          : [...categories.map(c => ({ name: c.name, list: inWeek(freeTasks).filter(t=>t.cat===c.id) })),
             { name: 'Ohne Kategorie', list: inWeek(freeTasks).filter(t=>!categories.some(c=>c.id===t.cat)) }];
        let md = `# PrioMatrix — KW ${selectedKw} (${weekDateRange(selectedKw)})\n`;
        for (const g of groups) {
          if (!g.list.length) continue;
          md += `\n## ${g.name}\n\n`;
          for (const t of g.list) {
            const done = t.endKw!==null && t.endKw<=selectedKw;
            md += `- [${done?'x':' '}] ${t.text}${t.due?` *(bis ${t.due})*`:''}${t.startKw<selectedKw?` *(seit KW ${t.startKw})*`:''}\n`;
            (t.subs || []).forEach((x, i) => { md += t.numbered ? `  ${i+1}. ${x.done?'~~'+x.text+'~~':x.text}\n` : `  - [${x.done?'x':' '}] ${x.text}\n`; });
            if (t.notes) md += t.notes.split('\n').map(l=>`  > ${l}`).join('\n') + '\n';
          }
        }
        const blob = new Blob([md], { type:'text/markdown' });
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `priomatrix-kw${selectedKw}.md` });
        a.click(); URL.revokeObjectURL(a.href);
        addToast({ type:'success', message:`KW ${selectedKw} als Markdown exportiert` });
      };
      const doExport = () => {
        const payload = { app:'PrioMatrix', version: 3, exportedAt: new Date().toISOString(), tasks, freeTasks, categories };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `priomatrix-backup-${new Date().toISOString().slice(0,10)}.json` });
        a.click(); URL.revokeObjectURL(a.href);
        addToast({ type:'success', message:`${total} Aufgaben exportiert` });
      };
      const doImport = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            const payload = Array.isArray(data) ? { tasks: data } : data;
            const ok = a => a === undefined || Array.isArray(a);
            if (!payload || typeof payload !== 'object' || !ok(payload.tasks) || !ok(payload.freeTasks) || !ok(payload.categories)) throw new Error();
            onImport(payload);
            addToast({ type:'success', message:`${(payload.tasks||[]).length + (payload.freeTasks||[]).length} Aufgaben importiert` }); onClose();
          } catch { addToast({ type:'error', message:'Ungültige Backup-Datei' }); }
        };
        reader.readAsText(file);
        if (fileRef.current) fileRef.current.value = '';
      };
      const doClear = () => {
        if (!confirm(`Alle ${total} Aufgaben (beide Modi) unwiderruflich löschen?`)) return;
        onImport({ tasks: [], freeTasks: [], categories: [] }); addToast({ type:'success', message:'Alle Daten gelöscht' }); onClose();
      };
      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm anim-fade flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white dark:bg-neutral-900 rounded-2xl shadow-2xl w-full max-w-sm border border-neutral-200 dark:border-neutral-700 overflow-hidden anim-zoom" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-4 border-b border-neutral-100 dark:border-neutral-800">
              <div className="flex items-center gap-2">
                <Ic n="db" size={16} cls="text-neutral-500"/>
                <h2 className="font-display font-semibold text-neutral-800 dark:text-neutral-100">Backup & Daten</h2>
              </div>
              <button onClick={onClose} className="p-1.5 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-400 transition-colors"><Ic n="x" size={15}/></button>
            </div>
            <div className="p-5 space-y-3">
              <div className="bg-neutral-50 dark:bg-neutral-800/60 rounded-xl p-4">
                <p className="text-xs text-neutral-500 dark:text-neutral-400 font-medium uppercase tracking-wider mb-2">Lokaler Speicher</p>
                <div className="flex items-baseline gap-1.5 mb-2">
                  <span className="text-xl font-bold font-display text-neutral-800 dark:text-neutral-100">{fmtBytes(sz)}</span>
                  <span className="text-xs text-neutral-400">/ ~5 MB</span>
                </div>
                <div className="h-1.5 bg-neutral-200 dark:bg-neutral-700 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full transition-all" style={{width:`${Math.min(sz/52428.8,100)}%`}}/>
                </div>
                <p className="text-xs text-neutral-400 mt-2">{total} Aufgaben gespeichert</p>
              </div>
              <button onClick={doExport} className="w-full flex items-center gap-3 px-4 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-medium text-sm transition-colors"><Ic n="dl" size={16}/> Als JSON exportieren</button>
              <button onClick={doMarkdown} className="w-full flex items-center gap-3 px-4 py-3 bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 text-neutral-700 dark:text-neutral-200 rounded-xl font-medium text-sm transition-colors"><Ic n="note" size={16}/> KW {selectedKw} als Markdown ({mode==='matrix'?'Matrix':'Kategorien'})</button>
              <button onClick={()=>fileRef.current?.click()} className="w-full flex items-center gap-3 px-4 py-3 bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 text-neutral-700 dark:text-neutral-200 rounded-xl font-medium text-sm transition-colors"><Ic n="ul" size={16}/> Backup importieren</button>
              <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={doImport}/>
              {total > 0 && (
                <button onClick={doClear} className="w-full flex items-center gap-3 px-4 py-3 bg-rose-50 dark:bg-rose-900/20 hover:bg-rose-100 dark:hover:bg-rose-900/30 text-rose-600 dark:text-rose-400 rounded-xl font-medium text-sm transition-colors"><Ic n="trash" size={16}/> Alle Daten löschen</button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ── Notes Modal ────────────────────────────────────────────────
    const NotesModal = ({ task, onSave, onClose }) => {
      const [notes, setNotes] = useState(task.notes || '');
      const ref = useRef(null);
      useEffect(() => { ref.current?.focus(); }, []);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm anim-fade flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white dark:bg-neutral-900 rounded-2xl shadow-2xl w-full max-w-md border border-neutral-200 dark:border-neutral-700 overflow-hidden anim-zoom" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-3.5 border-b border-neutral-100 dark:border-neutral-800">
              <p className="font-medium text-neutral-800 dark:text-neutral-100 truncate text-sm pr-4">{task.text}</p>
              <button onClick={onClose} className="p-1.5 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-400 shrink-0 transition-colors"><Ic n="x" size={14}/></button>
            </div>
            <div className="p-4">
              <textarea ref={ref} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Notizen, Details, Links…"
                className="w-full h-36 resize-none bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-xl p-3 text-sm text-neutral-700 dark:text-neutral-200 outline-none focus:border-blue-400 dark:focus:border-blue-500 placeholder-neutral-400 transition-colors"
                onKeyDown={e=>{ if(e.key==='Escape') onClose(); if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ onSave(notes); onClose(); }}}/>
              <div className="flex gap-2 mt-3">
                <button onClick={()=>{ onSave(notes); onClose(); }} className="flex-1 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-sm font-medium transition-colors">Speichern</button>
                <button onClick={onClose} className="px-4 py-2 bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 text-neutral-600 dark:text-neutral-300 rounded-xl text-sm transition-colors">Abbrechen</button>
              </div>
              <p className="text-xs text-neutral-400 mt-2 text-center">Tipp: Strg/⌘ + Enter zum Speichern</p>
            </div>
          </div>
        </div>
      );
    };

    // ── Zieldatum wählen ───────────────────────────────────────────
    const DueSheet = ({ value, onPick, onClose }) => {
      const chip = "px-3.5 py-2.5 rounded-xl text-sm font-medium bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 text-neutral-700 dark:text-neutral-200 transition-colors";
      const pick = d => { onPick(d); onClose(); };
      return (
        <div className="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm anim-fade flex items-end sm:items-center justify-center sm:p-4" onClick={onClose}>
          <div className="bg-white dark:bg-neutral-900 rounded-t-3xl sm:rounded-2xl shadow-2xl w-full max-w-sm border border-neutral-200 dark:border-neutral-700 anim-zoom p-5 safe-bottom" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <h2 className="font-display font-semibold text-neutral-800 dark:text-neutral-100 flex items-center gap-2"><Ic n="cal" size={16} cls="text-neutral-500"/> Zieldatum</h2>
              <button onClick={onClose} className="p-2 -mr-2 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-400"><Ic n="x" size={16}/></button>
            </div>
            <div className="flex flex-wrap gap-2 mb-3">
              <button className={chip} onClick={()=>pick(todayStr())}>Heute</button>
              <button className={chip} onClick={()=>pick(addDays(todayStr(),1))}>Morgen</button>
              <button className={chip} onClick={()=>pick(nextMonday())}>Nächste Woche</button>
              {value && <button className={chip+' !text-rose-500'} onClick={()=>pick(null)}>Entfernen</button>}
            </div>
            <input type="date" value={value||''} onChange={e=>e.target.value && pick(e.target.value)}
              className="w-full bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-neutral-700 dark:text-neutral-200 outline-none focus:border-blue-400"/>
          </div>
        </div>
      );
    };

    // ── Kategorie / Quadrant wählen (Touch-freundlicher Ersatz für Drag & Drop) ──
    const MovePicker = ({ groups, current, onPick, onClose }) => (
      <div className="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm anim-fade flex items-end sm:items-center justify-center sm:p-4" onClick={onClose}>
        <div className="bg-white dark:bg-neutral-900 rounded-t-3xl sm:rounded-2xl shadow-2xl w-full max-w-sm border border-neutral-200 dark:border-neutral-700 anim-zoom p-3 safe-bottom max-h-[80vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
          <p className="px-3 pt-2 pb-2 text-xs font-semibold uppercase tracking-wider text-neutral-400">Verschieben nach</p>
          {groups.map(g => (
            <button key={String(g.id)} onClick={()=>{ onPick(g.id); onClose(); }}
              className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left text-sm font-medium transition-colors hover:bg-neutral-100 dark:hover:bg-neutral-800 ${g.id===current ? 'text-blue-600 dark:text-blue-400' : 'text-neutral-700 dark:text-neutral-200'}`}>
              <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: g.color }}/>
              <span className="flex-1 truncate">{g.label}</span>
              {g.id===current && <Ic n="check" size={15}/>}
            </button>
          ))}
        </div>
      </div>
    );

    // ── Unterpunkte ────────────────────────────────────────────────
    const SubRow = ({ task, sub, idx, big, showDelete, toggleSub, editSub, deleteSub }) => {
      const [edit, setEdit] = useState(false);
      const [val, setVal] = useState(sub.text);
      const save = () => { setEdit(false); const v = val.trim(); if (v !== sub.text) editSub(task.id, sub.id, v); if (!v) setVal(sub.text); };
      return (
        <div className="group/sub flex items-center gap-1">
          <button onClick={()=>toggleSub(task.id, sub.id)} aria-label={sub.done ? 'Wieder öffnen' : 'Erledigt'}
            className={`shrink-0 flex items-center justify-center rounded-full ${big ? 'w-11 h-11' : 'w-6 h-6'} ${sub.done ? 'text-emerald-500' : 'text-neutral-300 dark:text-neutral-600 hover:text-emerald-500'}`}>
            <Ic n={sub.done ? 'check' : 'circle'} size={big ? 22 : 15}/>
          </button>
          {task.numbered && <span className="shrink-0 text-xs font-medium text-neutral-400 tabular-nums">{idx + 1}.</span>}
          {edit ? (
            <input autoFocus value={val} onChange={e=>setVal(e.target.value)} onBlur={save}
              onKeyDown={e=>{ if(e.key==='Enter') save(); if(e.key==='Escape'){ setVal(sub.text); setEdit(false); } }}
              className="flex-1 min-w-0 bg-blue-50 dark:bg-blue-900/30 border border-blue-300 dark:border-blue-600 rounded-lg px-2 py-1 text-sm text-neutral-800 dark:text-neutral-100 outline-none"/>
          ) : (
            <span onClick={()=>setEdit(true)} className={`flex-1 min-w-0 break-words text-sm leading-snug py-1.5 cursor-text ${sub.done ? 'line-through text-neutral-400 dark:text-neutral-500' : 'text-neutral-700 dark:text-neutral-200'}`}>{sub.text}</span>
          )}
          {showDelete && (
            <button onClick={()=>deleteSub(task.id, sub.id)} aria-label="Unterpunkt löschen"
              className={`shrink-0 flex items-center justify-center rounded-lg text-neutral-400 hover:text-rose-500 ${big ? 'w-11 h-11' : 'w-6 h-6 opacity-0 group-hover/sub:opacity-100'}`}><Ic n="x" size={big ? 16 : 12}/></button>
          )}
        </div>
      );
    };
    const SubList = ({ task, big, showInput, showDelete, toggleSub, editSub, deleteSub, addSubs }) => {
      const [v, setV] = useState('');
      const add = () => { if (v.trim()) { addSubs(task.id, v); setV(''); } };
      return (
        <div className="space-y-0.5">
          {(task.subs || []).map((sb, i) => <SubRow key={sb.id} task={task} sub={sb} idx={i} big={big} showDelete={showDelete} toggleSub={toggleSub} editSub={editSub} deleteSub={deleteSub}/>)}
          {showInput && (
            <div className="flex items-center gap-1 pt-1">
              <input autoFocus={!big} value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} enterKeyHint="done"
                onPaste={e=>{ const t = e.clipboardData?.getData('text') || ''; if (/\n/.test(t.trim())) { e.preventDefault(); addSubs(task.id, t); setV(''); } }}
                placeholder="Unterpunkt hinzufügen…"
                className={`flex-1 min-w-0 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg px-2.5 text-sm text-neutral-700 dark:text-neutral-200 outline-none focus:border-blue-400 placeholder-neutral-400 ${big ? 'min-h-[44px]' : 'py-1'}`}/>
              <button onClick={add} aria-label="Unterpunkt hinzufügen" className={`shrink-0 flex items-center justify-center rounded-lg text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 ${big ? 'w-11 h-11' : 'w-7 h-7'}`}><Ic n="plus" size={big ? 18 : 14}/></button>
            </div>
          )}
        </div>
      );
    };

    // ── Wischen: rechts = erledigt, links = Details ────────────────
    const SwipeRow = ({ children, done, onRight, onLeft }) => {
      const [dx, setDx] = useState(0);
      const st = useRef(null);
      const TH = 90;
      const start = e => { const t = e.touches[0]; st.current = { x: t.clientX, y: t.clientY, lock: null }; };
      const move = e => {
        const s0 = st.current; if (!s0) return;
        const t = e.touches[0]; const mx = t.clientX - s0.x, my = t.clientY - s0.y;
        if (s0.lock === null) {
          if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.5) s0.lock = 'h';
          else if (Math.abs(my) > 10) s0.lock = 'v';
        }
        if (s0.lock === 'h') setDx(Math.max(-140, Math.min(140, mx)));
      };
      const end = () => {
        const s0 = st.current; st.current = null;
        if (s0?.lock === 'h') {
          if (dx >= TH) { try { navigator.vibrate?.(15); } catch {} onRight(); }
          else if (dx <= -TH) onLeft();
        }
        setDx(0);
      };
      return (
        <div className="relative rounded-xl overflow-hidden anim-slide">
          <div style={{ opacity: dx === 0 ? 0 : 1 }} className={`absolute inset-0 flex items-center justify-between px-5 text-sm font-semibold ${dx >= 0 ? 'bg-emerald-500 text-white' : 'bg-blue-500 text-white'}`}>
            <span className="flex items-center gap-2"><Ic n="check" size={20}/>{done ? 'Wieder öffnen' : 'Erledigt'}</span>
            <span className="flex items-center gap-2">Details<Ic n="dots" size={20}/></span>
          </div>
          <div onTouchStart={start} onTouchMove={move} onTouchEnd={end} onTouchCancel={()=>{ st.current = null; setDx(0); }}
            style={{ transform: `translateX(${dx}px)`, transition: dx === 0 ? 'transform .2s ease' : 'none', touchAction: 'pan-y' }}>
            {children}
          </div>
        </div>
      );
    };

    // ── "N erledigt anzeigen" ──────────────────────────────────────
    const DoneRow = ({ count, open, onToggle }) => count > 0 ? (
      <button onClick={onToggle} className="w-full min-h-[44px] flex items-center justify-center gap-1.5 text-xs font-medium text-neutral-500 dark:text-neutral-400 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
        <Ic n={open ? 'chevUp' : 'chevDown'} size={14}/>{open ? 'Erledigte ausblenden' : `${count} erledigt anzeigen`}
      </button>
    ) : null;

    // ── Task-Details (Bottom-Sheet) ────────────────────────────────
    const SheetLabel = ({ children }) => <p className="text-[11px] font-semibold uppercase tracking-wider text-neutral-400 mb-2 mt-4">{children}</p>;
    const TaskSheet = ({ task, groups, groupKey, selectedKw, onClose, toggleSub, editSub, deleteSub, addSubs, setNumbered, editTask, updateNotes, setDue, moveTask, toggleTask, postponeTask, deleteTask, restoreTask, addToast, attachImageToTask, removeImage }) => {
      const [text, setText] = useState(task.text);
      const [notes, setNotes] = useState(task.notes || '');
      const [lightbox, setLightbox] = useState(false);
      const fileRef = useRef(null);
      const done = isDoneT(task, selectedKw);
      const commit = () => {
        const t = text.trim();
        if (t && t !== task.text) editTask(task.id, t);
        if (notes !== (task.notes || '')) updateNotes(task.id, notes);
      };
      const close = () => { commit(); onClose(); };
      const chip = on => `px-4 min-h-[44px] rounded-xl text-sm font-medium transition-colors flex items-center gap-2 ${on ? 'bg-blue-500 text-white' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200 active:bg-neutral-200 dark:active:bg-neutral-700'}`;
      const big = "w-full min-h-[52px] rounded-xl text-[15px] font-medium flex items-center justify-center gap-2 transition-colors";
      const handleFile = async (e) => {
        const f = e.target.files[0];
        if (f?.type.startsWith('image/')) attachImageToTask(task.id, await resizeImage(f));
        if (fileRef.current) fileRef.current.value = '';
      };
      const doDelete = () => {
        const snap = { ...task };
        deleteTask(task.id); onClose();
        addToast({ message:'Aufgabe gelöscht', action:()=>restoreTask(snap) });
      };
      const tomorrow = addDays(todayStr(), 1);
      return (
        <div className="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm anim-fade flex items-end justify-center" onClick={close}>
          <div className="bg-white dark:bg-neutral-900 rounded-t-3xl shadow-2xl w-full max-w-lg max-h-[92dvh] overflow-y-auto px-4 pt-2 safe-bottom pb-4 anim-slide" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between mb-1">
              <span className="text-xs font-semibold uppercase tracking-wider text-neutral-400 pt-3">Aufgabe</span>
              <button onClick={close} aria-label="Schließen" className="w-11 h-11 -mr-2 flex items-center justify-center rounded-xl text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800"><Ic n="x" size={18}/></button>
            </div>
            <textarea value={text} onChange={e=>setText(e.target.value)} rows={2}
              className="w-full resize-none bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-xl px-3 py-2.5 text-neutral-800 dark:text-neutral-100 outline-none focus:border-blue-400"/>

            <SheetLabel>Zieldatum</SheetLabel>
            <div className="flex flex-wrap gap-2">
              <button className={chip(task.due === todayStr())} onClick={()=>setDue(task.id, todayStr())}>Heute</button>
              <button className={chip(task.due === tomorrow)} onClick={()=>setDue(task.id, tomorrow)}>Morgen</button>
              <button className={chip(task.due === nextMonday())} onClick={()=>setDue(task.id, nextMonday())}>Nächste Woche</button>
              {task.due && <button className={chip(false)+' !text-rose-500'} onClick={()=>setDue(task.id, null)}>Kein Datum</button>}
            </div>
            <input type="date" value={task.due || ''} onChange={e=>setDue(task.id, e.target.value || null)}
              className="mt-2 w-full min-h-[44px] bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-xl px-3 text-neutral-700 dark:text-neutral-200 outline-none focus:border-blue-400"/>

            <SheetLabel>{groupKey === 'cat' ? 'Kategorie' : 'Quadrant'}</SheetLabel>
            <div className="flex flex-wrap gap-2">
              {groups.map(g => (
                <button key={String(g.id)} className={chip((task[groupKey] ?? null) === g.id)} onClick={()=>moveTask(task.id, g.id)}>
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: g.color }}/>{g.short || g.label}
                </button>
              ))}
            </div>

            {groupKey === 'cat' && (
              <>
                <SheetLabel>Unterpunkte</SheetLabel>
                <SubList task={task} big showInput showDelete toggleSub={toggleSub} editSub={editSub} deleteSub={deleteSub} addSubs={addSubs}/>
                {(task.subs || []).length > 0 && (
                  <button onClick={()=>setNumbered(task.id, !task.numbered)} className={`${chip(!!task.numbered)} mt-2`}>Nummerieren</button>
                )}
              </>
            )}

            <SheetLabel>Notiz</SheetLabel>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3} placeholder="Notizen, Details, Links…"
              className="w-full resize-none bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-xl px-3 py-2.5 text-neutral-700 dark:text-neutral-200 outline-none focus:border-blue-400 placeholder-neutral-400"/>

            <SheetLabel>Bild</SheetLabel>
            {task.image ? (
              <div className="flex items-center gap-3">
                <img src={task.image} alt="" onClick={()=>setLightbox(true)} className="h-24 rounded-xl border border-neutral-200 dark:border-neutral-700 object-contain"/>
                <button onClick={()=>removeImage(task.id)} className={chip(false)}>Bild entfernen</button>
              </div>
            ) : (
              <button onClick={()=>fileRef.current?.click()} className={chip(false)}><Ic n="image" size={16}/> Bild hinzufügen</button>
            )}
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>

            <div className="mt-5 space-y-2.5">
              <button onClick={()=>{ commit(); toggleTask(task.id); onClose(); }}
                className={`${big} ${done ? 'bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200' : 'bg-emerald-500 text-white active:bg-emerald-600'}`}>
                <Ic n="check" size={18}/>{done ? 'Wieder öffnen' : 'Erledigt'}
              </button>
              {!done && selectedKw < 52 && (
                <button onClick={()=>{ commit(); postponeTask(task.id); onClose(); }} className={`${big} bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200`}><Ic n="arrowRight" size={18}/> Auf nächste Woche</button>
              )}
            </div>
            <button onClick={doDelete} className={`${big} mt-8 bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400`}><Ic n="trash" size={18}/> Aufgabe löschen</button>
          </div>
          {lightbox && task.image && <Lightbox src={task.image} onClose={()=>setLightbox(false)}/>}
        </div>
      );
    };

    // ── Menü (Handy): selten genutzte Aktionen ─────────────────────
    const MenuSheet = ({ dark, setDark, notifPerm, enableNotifications, openBackup, onClose }) => {
      const row = "w-full min-h-[52px] px-4 flex items-center gap-3 rounded-xl text-[15px] font-medium text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 text-left";
      return (
        <div className="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm anim-fade flex items-end justify-center" onClick={onClose}>
          <div className="bg-white dark:bg-neutral-900 rounded-t-3xl shadow-2xl w-full max-w-lg p-3 safe-bottom anim-slide" onClick={e=>e.stopPropagation()}>
            {notifPerm === 'default' && <button className={row} onClick={()=>{ enableNotifications(); onClose(); }}><Ic n="bell" size={18}/> Erinnerungen aktivieren</button>}
            <button className={row} onClick={()=>{ onClose(); openBackup(); }}><Ic n="db" size={18}/> Backup &amp; Daten</button>
            <button className={row} onClick={()=>{ setDark(d=>!d); onClose(); }}><Ic n={dark?'sun':'moon'} size={18}/> {dark ? 'Heller Modus' : 'Dunkler Modus'}</button>
          </div>
        </div>
      );
    };

    // ── "Heute": überfällig + heute fällig, über alle Gruppen ───────
    const TodayList = ({ tasks, tagOf, taskProps, selectedKw }) => tasks.length === 0 ? (
      <div className="text-center py-16 text-neutral-400"><p className="text-3xl mb-2">🎉</p><p className="text-sm">Nichts fällig oder überfällig.</p></div>
    ) : (
      <div className="space-y-2 max-w-xl mx-auto pb-4">
        {tasks.map(t => <TaskItem key={t.id} task={t} isCompleted={false} selectedKw={selectedKw} currentKw={selectedKw} accentDot="" tag={tagOf(t)} {...taskProps}/>)}
      </div>
    );

    // ── TaskItem ───────────────────────────────────────────────────
    const TaskItem = ({ task, isCompleted, accentDot, mobile, openSheet, tag, toggleSub, editSub, deleteSub, addSubs, groups, groupKey, moveTask, setDue, toggleTask, deleteTask, attachImageToTask, removeImage, editTask, updateNotes, addToast, currentKw, selectedKw, reorderTask, restoreTask, postponeTask }) => {
      const [dropOver, setDropOver] = useState(false);
      const [dragging, setDragging] = useState(false);
      const [editing, setEditing] = useState(false);
      const [editText, setEditText] = useState(task.text);
      const [showNotes, setShowNotes] = useState(false);
      const [lightbox, setLightbox] = useState(false);
      const [showDue, setShowDue] = useState(false);
      const [showMove, setShowMove] = useState(false);
      const [showActs, setShowActs] = useState(false);
      const [showSubs, setShowSubs] = useState(false);
      const [addingSub, setAddingSub] = useState(false);
      const subs = task.subs || [];
      const subDone = subs.filter(x => x.done).length;
      const canSubs = groupKey === 'cat';
      const fileRef = useRef(null);
      const carriedOver = !isCompleted && task.startKw < selectedKw;
      const overdue = isOverdue(task);
      const dueToday = !isCompleted && task.due === todayStr();

      const handleDrop = async (e) => {
        e.preventDefault(); setDropOver(false);
        try {
          const d = JSON.parse(e.dataTransfer.getData('application/json'));
          if (d.type === 'task' && d.id !== task.id) { e.stopPropagation(); reorderTask(d.id, task.id); return; }
        } catch {}
        const file = e.dataTransfer.files[0];
        if (file?.type.startsWith('image/')) { e.stopPropagation(); attachImageToTask(task.id, await resizeImage(file)); }
      };
      const handleFile = async (e) => {
        const file = e.target.files[0];
        if (file?.type.startsWith('image/')) attachImageToTask(task.id, await resizeImage(file));
        if (fileRef.current) fileRef.current.value = '';
      };
      const saveEdit = () => {
        setEditing(false);
        const t = editText.trim();
        if (t && t !== task.text) editTask(task.id, t); else setEditText(task.text);
      };
      const handleDelete = () => {
        const snap = { ...task };
        deleteTask(task.id);
        addToast({ message:'Aufgabe gelöscht', action:()=>restoreTask(snap) });
      };

      if (mobile) {
        return (
          <SwipeRow done={isCompleted} onRight={()=>toggleTask(task.id)} onLeft={()=>openSheet(task.id)}>
            <div className={`rounded-xl border bg-white dark:bg-neutral-800 ${isCompleted ? 'border-neutral-200/70 dark:border-neutral-700/60 opacity-60' : 'border-neutral-200 dark:border-neutral-700'}`}>
            <div className="flex items-center pl-0.5 pr-0.5 min-h-[60px]">
              <button onClick={()=>toggleTask(task.id)} aria-label={isCompleted ? 'Wieder öffnen' : 'Erledigt'}
                className={`shrink-0 w-12 h-12 flex items-center justify-center rounded-full ${isCompleted ? 'text-emerald-500' : 'text-neutral-300 dark:text-neutral-600 active:text-emerald-500'}`}>
                <Ic n={isCompleted ? 'check' : 'circle'} size={26}/>
              </button>
              <button onClick={()=>openSheet(task.id)} className="flex-1 min-w-0 text-left py-2.5 pr-1">
                <span className={`block text-[15px] leading-snug line-clamp-2 break-words ${isCompleted ? 'text-neutral-400 dark:text-neutral-500 line-through' : 'text-neutral-800 dark:text-neutral-100'}`}>{task.text}</span>
                {(task.due || carriedOver || task.notes || task.image || tag) && (
                  <span className="flex flex-wrap items-center gap-1.5 mt-1">
                    {tag && <span className="inline-flex items-center gap-1 text-[11px] font-medium text-neutral-500 dark:text-neutral-400"><span className="w-2 h-2 rounded-full" style={{ background: tag.color }}/>{tag.label}</span>}
                    {task.due && (
                      <span className={`inline-flex items-center gap-1 whitespace-nowrap text-[11px] font-medium px-1.5 py-0.5 rounded-md ${overdue ? 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10' : dueToday ? 'text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-500/10' : 'text-neutral-500 dark:text-neutral-400 bg-neutral-100 dark:bg-neutral-700/50'}`}>
                        <Ic n={overdue?'alert':'cal'} size={10}/>{overdue ? 'Überfällig · ' : ''}{fmtDue(task.due)}
                      </span>
                    )}
                    {carriedOver && <span className="text-[10px] font-medium text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-1.5 py-0.5 rounded-md">seit KW {task.startKw}</span>}
                    {task.notes && <Ic n="note" size={11} cls="text-neutral-400"/>}
                    {task.image && <Ic n="image" size={11} cls="text-neutral-400"/>}
                  </span>
                )}
              </button>
              {canSubs && subs.length > 0 && !isCompleted && (
                <button onClick={()=>setShowSubs(o=>!o)} aria-label="Unterpunkte" className={`shrink-0 h-11 px-2 flex items-center gap-1 rounded-xl text-xs font-semibold tabular-nums ${subDone === subs.length ? 'text-emerald-600 dark:text-emerald-400' : 'text-neutral-500 dark:text-neutral-400'}`}>
                  <Ic n="check" size={13}/>{subDone}/{subs.length}<Ic n={showSubs ? 'chevUp' : 'chevDown'} size={13}/>
                </button>
              )}
              <button onClick={()=>openSheet(task.id)} aria-label="Details" className="shrink-0 w-11 h-11 flex items-center justify-center rounded-xl text-neutral-400 active:bg-neutral-100 dark:active:bg-neutral-700"><Ic n="dots" size={18}/></button>
            </div>
            {canSubs && showSubs && !isCompleted && subs.length > 0 && (
              <div className="pl-10 pr-2 pb-2 border-t border-neutral-100 dark:border-neutral-700/60">
                <SubList task={task} big toggleSub={toggleSub} editSub={editSub} deleteSub={deleteSub} addSubs={addSubs}/>
              </div>
            )}
            </div>
          </SwipeRow>
        );
      }

      return (
        <>
          <div
            draggable={!editing}
            onDragStart={e => { if(editing) return; setDragging(true); e.dataTransfer.setData('application/json', JSON.stringify({type:'task',id:task.id})); }}
            onDragEnd={()=>setDragging(false)}
            onDragOver={e=>{ e.preventDefault(); setDropOver(true); }}
            onDragLeave={()=>setDropOver(false)}
            onDrop={handleDrop}
            className={`group relative flex flex-col pl-3 pr-2.5 py-2.5 rounded-xl border anim-slide transition-all bg-white dark:bg-neutral-800/80
              ${isCompleted ? 'border-neutral-200/70 dark:border-neutral-700/60 opacity-60' : 'border-neutral-200 dark:border-neutral-700 hover:border-neutral-300 dark:hover:border-neutral-600 hover:shadow-md hover:-translate-y-px'}
              ${dropOver ? 'ring-2 ring-blue-400 border-blue-300 dark:border-blue-600' : ''}
              ${dragging ? 'opacity-30 scale-[0.97] rotate-1' : ''}
              ${!editing ? 'cursor-grab active:cursor-grabbing' : ''}`}
          >
            <div className="flex flex-wrap md:flex-nowrap items-start gap-x-2.5 gap-y-1 w-full">
              <button onClick={()=>toggleTask(task.id)}
                className={`flex-shrink-0 mt-0.5 transition-all rounded-full chk ${isCompleted ? 'text-emerald-500 anim-pop' : 'text-neutral-300 dark:text-neutral-600 hover:text-emerald-500 hover:scale-110'}`}>
                <Ic n={isCompleted?'check':'circle'} size={20}/>
              </button>

              <div className="flex-1 min-w-0">
                {editing ? (
                  <input type="text" value={editText} autoFocus
                    onChange={e=>setEditText(e.target.value)} onBlur={saveEdit}
                    onKeyDown={e=>{ if(e.key==='Enter') saveEdit(); if(e.key==='Escape'){ setEditText(task.text); setEditing(false); } }}
                    className="w-full bg-blue-50 dark:bg-blue-900/30 border border-blue-300 dark:border-blue-600 rounded-lg px-2 py-0.5 text-sm text-neutral-800 dark:text-neutral-100 outline-none"/>
                ) : (
                  <span onClick={()=>!isCompleted&&setEditing(true)}
                    className={`block w-full break-words text-sm leading-snug px-1 py-0.5 rounded-lg -ml-1 transition-colors ${isCompleted ? 'text-neutral-400 dark:text-neutral-500 line-through cursor-default' : 'text-neutral-700 dark:text-neutral-200 cursor-text hover:bg-neutral-50 dark:hover:bg-neutral-700/50'}`}>
                    {task.text}
                  </span>
                )}
                {(carriedOver || task.notes || task.due || subs.length > 0) && !editing && (
                  <div className="flex flex-wrap items-center gap-2 mt-1 ml-0">
                    {task.due && (
                      <button onClick={()=>setShowDue(true)} title="Zieldatum ändern"
                        className={`inline-flex items-center gap-1 whitespace-nowrap text-[11px] font-medium px-1.5 py-0.5 rounded-md
                          ${overdue ? 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10' : dueToday ? 'text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-500/10' : 'text-neutral-500 dark:text-neutral-400 bg-neutral-100 dark:bg-neutral-700/50'}`}>
                        <Ic n={overdue?'alert':'cal'} size={10}/> {overdue ? 'Überfällig · ' : ''}{fmtDue(task.due)}
                      </button>
                    )}
                    {carriedOver && (
                      <span className="inline-flex items-center gap-1 text-[10px] font-medium text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-1.5 py-0.5 rounded-md" title={`Seit KW ${task.startKw} offen`}>
                        <Ic n="arrow" size={9}/> seit KW {task.startKw}
                      </span>
                    )}
                    {task.notes && <Ic n="note" size={11} cls="text-neutral-400 dark:text-neutral-500"/>}
                    {subs.length > 0 && (
                      <span className={`inline-flex items-center gap-1 text-[11px] font-medium px-1.5 py-0.5 rounded-md ${subDone === subs.length ? 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10' : 'text-neutral-500 dark:text-neutral-400 bg-neutral-100 dark:bg-neutral-700/50'}`}>
                        <Ic n="check" size={10}/> {subDone}/{subs.length}
                      </span>
                    )}
                  </div>
                )}
              </div>

              <button onClick={()=>setShowActs(a=>!a)} aria-label="Aktionen" className="md:hidden shrink-0 p-1.5 -mr-1 rounded-lg text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-700"><Ic n="dots" size={16}/></button>
              <div className={`act-row ${showActs ? 'flex' : 'hidden'} md:flex w-full md:w-auto order-last md:order-none justify-end md:opacity-0 md:group-hover:opacity-100 items-center gap-0.5 shrink-0 transition-opacity`}>
                {!isCompleted && (
                  <button onClick={()=>setShowDue(true)} title="Zieldatum" className="p-1 rounded-lg text-neutral-400 hover:text-orange-500 hover:bg-orange-50 dark:hover:bg-orange-900/30 transition-colors"><Ic n="cal" size={13}/></button>
                )}
                <button onClick={()=>setShowMove(true)} title="Verschieben nach…" className="p-1 rounded-lg text-neutral-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors"><Ic n="tag" size={13}/></button>
                {!isCompleted && selectedKw < 52 && (
                  <button onClick={()=>postponeTask(task.id)} title="Auf nächste Woche schieben" className="p-1 rounded-lg text-neutral-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30 transition-colors"><Ic n="arrowRight" size={13}/></button>
                )}
                {canSubs && !isCompleted && (
                  <button onClick={()=>setAddingSub(a=>!a)} title="Unterpunkt hinzufügen" className="p-1 rounded-lg text-neutral-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors"><Ic n="plus" size={13}/></button>
                )}
                <button onClick={()=>setShowNotes(true)} title="Notiz" className="p-1 rounded-lg text-neutral-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors"><Ic n="note" size={13}/></button>
                <button onClick={()=>fileRef.current?.click()} title="Bild" className="p-1 rounded-lg text-neutral-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors"><Ic n="image" size={13}/></button>
                <button onClick={handleDelete} title="Löschen" className="p-1 rounded-lg text-neutral-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-colors"><Ic n="trash" size={13}/></button>
              </div>
            </div>

            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>

            {canSubs && !isCompleted && (subs.length > 0 || addingSub) && (
              <div className="mt-1.5 ml-6">
                <SubList task={task} showInput={addingSub} showDelete toggleSub={toggleSub} editSub={editSub} deleteSub={deleteSub} addSubs={addSubs}/>
              </div>
            )}

            {task.notes && !editing && <p className="mt-1 ml-7 text-xs text-neutral-400 dark:text-neutral-500 line-clamp-2 leading-relaxed">{task.notes}</p>}

            {task.image && (
              <div className="mt-2 ml-7 relative group/img inline-block">
                <img src={task.image} alt="" onClick={()=>setLightbox(true)} className="max-h-40 rounded-xl border border-neutral-200 dark:border-neutral-700 object-contain cursor-zoom-in hover:opacity-90 transition-opacity"/>
                <button onClick={()=>removeImage(task.id)} className="absolute -top-1.5 -right-1.5 bg-white dark:bg-neutral-800 text-neutral-400 hover:text-rose-500 rounded-full shadow-md p-0.5 opacity-0 group-hover/img:opacity-100 transition-opacity border border-neutral-200 dark:border-neutral-700"><Ic n="x" size={11}/></button>
              </div>
            )}
          </div>
          {showDue && <DueSheet value={task.due} onPick={d=>setDue(task.id, d)} onClose={()=>setShowDue(false)}/>}
          {showMove && <MovePicker groups={groups} current={task[groupKey] ?? null} onPick={g=>moveTask(task.id, g)} onClose={()=>setShowMove(false)}/>}
          {showNotes && <NotesModal task={task} onSave={n=>updateNotes(task.id,n)} onClose={()=>setShowNotes(false)}/>}
          {lightbox && task.image && <Lightbox src={task.image} onClose={()=>setLightbox(false)}/>}
        </>
      );
    };

    // ── Quadrant ───────────────────────────────────────────────────
    const Q_STYLE = {
      q1: { verb:'Erledigen', icon:'bolt', accent:'text-rose-500', dot:'bg-rose-500',
            tint:'bg-rose-50/40 dark:bg-rose-950/15', headTint:'bg-rose-50/80 dark:bg-rose-950/25',
            bar:'bg-rose-500', pill:'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300',
            btn:'hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30' },
      q2: { verb:'Einplanen', icon:'cal', accent:'text-blue-500', dot:'bg-blue-500',
            tint:'bg-blue-50/40 dark:bg-blue-950/15', headTint:'bg-blue-50/80 dark:bg-blue-950/25',
            bar:'bg-blue-500', pill:'bg-blue-100 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300',
            btn:'hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30' },
      q3: { verb:'Delegieren', icon:'arrowRight', accent:'text-amber-500', dot:'bg-amber-500',
            tint:'bg-amber-50/40 dark:bg-amber-950/15', headTint:'bg-amber-50/80 dark:bg-amber-950/25',
            bar:'bg-amber-500', pill:'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300',
            btn:'hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30' },
      q4: { verb:'Eliminieren', icon:'trash', accent:'text-zinc-400', dot:'bg-zinc-400',
            tint:'bg-zinc-50/40 dark:bg-zinc-900/30', headTint:'bg-zinc-100/70 dark:bg-zinc-800/40',
            bar:'bg-zinc-400', pill:'bg-zinc-200 text-zinc-600 dark:bg-zinc-700/40 dark:text-zinc-300',
            btn:'hover:text-zinc-600 hover:bg-zinc-100 dark:hover:bg-zinc-800' },
    };

    const renderUrg = (subtitle, accent) =>
      subtitle.split(/(&)|(Wichtig)|(Nicht wichtig)|(Dringend)|(Nicht dringend)/g).filter(Boolean).map((w, i) => {
        if (w === '&') return <span key={i} className="text-neutral-300 dark:text-neutral-600 mx-1 font-normal">·</span>;
        if (w === 'Wichtig' || w === 'Dringend') return <span key={i} className={accent}>{w}</span>;
        if (w === 'Nicht wichtig' || w === 'Nicht dringend') return <span key={i} className="text-neutral-400 dark:text-neutral-500">{w}</span>;
        return <span key={i}>{w}</span>;
      });

    const Quadrant = ({ id, subtitle, tasks, selectedKw, currentKw, addTask, showDone, ...rest }) => {
      const [input, setInput] = useState('');
      const [openDone, setOpenDone] = useState(false);
      const [dropOver, setDropOver] = useState(false);
      const [focused, setFocused] = useState(false);
      const fileRef = useRef(null);
      const s = Q_STYLE[id];
      const done = tasks.filter(t=>t.endKw!==null && t.endKw<=selectedKw).length;
      const pct = tasks.length ? done / tasks.length : 0;
      const shown = (showDone || openDone) ? tasks : tasks.filter(t => !isDoneT(t, selectedKw));

      const doAdd = () => { if(input.trim()){ const p = parseQuick(input, []); addTask(id, p.text || input, null, p.due); setInput(''); } };
      const handlePaste = async (e) => {
        const items = e.clipboardData?.items; if (!items) return;
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            e.preventDefault();
            const file = item.getAsFile();
            if (file) addTask(id, input, await resizeImage(file));
            return;
          }
        }
      };
      const handleDrop = async (e) => {
        e.preventDefault(); setDropOver(false);
        try { const d = JSON.parse(e.dataTransfer.getData('application/json')); if(d.type==='task'){ rest.moveTask(d.id, id); return; } } catch {}
        const file = e.dataTransfer.files[0];
        if(file?.type.startsWith('image/')) addTask(id, '', await resizeImage(file));
      };
      const handleFile = async (e) => {
        const file = e.target.files[0];
        if(file?.type.startsWith('image/')){ addTask(id, input, await resizeImage(file)); setInput(''); }
        if(fileRef.current) fileRef.current.value = '';
      };

      return (
        <div
          onDragOver={e=>{ e.preventDefault(); setDropOver(true); }}
          onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setDropOver(false); }}
          onDrop={handleDrop}
          className={`relative flex flex-col rounded-2xl overflow-hidden card-shadow transition-all border border-neutral-200/70 dark:border-neutral-800 ${s.tint}
            ${dropOver ? 'ring-2 ring-blue-400 ring-offset-2 ring-offset-neutral-100 dark:ring-offset-neutral-950' : ''}`}
        >
          {/* accent bar */}
          <div className={`absolute left-0 top-0 bottom-0 w-1 ${s.bar}`}/>

          {/* Header */}
          <div className={`pl-5 pr-3 pt-3.5 pb-3 ${s.headTint} border-b border-neutral-200/60 dark:border-neutral-800 flex items-start justify-between gap-2 shrink-0`}>
            <div className="min-w-0">
              <p className="font-display text-[17px] font-semibold leading-tight">{renderUrg(subtitle, s.accent)}</p>
              <div className="flex items-center gap-1.5 mt-1.5">
                <span className={`inline-flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-md ${s.pill}`}>
                  <Ic n={s.icon} size={11}/> {s.verb}
                </span>
              </div>
            </div>
            {tasks.length > 0 && (
              <div className="flex items-center gap-2 shrink-0">
                <span className="text-xs font-semibold text-neutral-500 dark:text-neutral-400 tabular-nums">{done}/{tasks.length}</span>
                <Ring pct={pct} size={30} stroke={3}/>
              </div>
            )}
          </div>

          {/* Task list */}
          <div className="flex-1 p-3 pl-4 space-y-2 md:overflow-y-auto min-h-[150px] md:min-h-0">
            {tasks.length === 0 ? (
              <label className="flex flex-col items-center justify-center h-full min-h-[120px] text-neutral-300 dark:text-neutral-700 gap-2 cursor-pointer hover:text-neutral-400 dark:hover:text-neutral-600 transition-colors" onClick={()=>fileRef.current?.click()}>
                <Ic n={s.icon} size={28} sw={1.5}/>
                <p className="text-xs text-center leading-relaxed">Noch nichts hier.<br/>Tippen, ziehen oder einfügen.</p>
              </label>
            ) : (
              <>
                {shown.length === 0 && <p className="text-xs text-neutral-400 dark:text-neutral-600 text-center py-4">Alles erledigt 🎉</p>}
                {shown.map(t => (
                  <TaskItem key={t.id} task={t} isCompleted={isDoneT(t, selectedKw)} selectedKw={selectedKw} currentKw={currentKw} accentDot={s.dot} addTask={addTask} {...rest}/>
                ))}
                {!showDone && <DoneRow count={done} open={openDone} onToggle={()=>setOpenDone(o=>!o)}/>}
              </>
            )}
          </div>

          {/* Input */}
          <div className={`pl-4 pr-3 py-2.5 bg-white/70 dark:bg-neutral-900/60 backdrop-blur-sm border-t border-neutral-200/60 dark:border-neutral-800 flex items-center gap-1.5 shrink-0 transition-colors ${focused ? 'bg-white dark:bg-neutral-900' : ''}`}>
            <button onClick={doAdd} className={`w-11 h-11 md:w-auto md:h-auto md:p-1 flex items-center justify-center rounded-lg ${s.accent} ${s.btn} transition-colors shrink-0`}><Ic n="plus" size={18}/></button>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doAdd()} onPaste={handlePaste}
              onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
              placeholder={focused ? "Aufgabe… (⏎ · Strg+V für Bild)" : "Neue Aufgabe…"}
              className="flex-1 bg-transparent text-sm text-neutral-700 dark:text-neutral-200 placeholder-neutral-400 dark:placeholder-neutral-600 outline-none min-w-0 py-1"/>
            <button onClick={()=>fileRef.current?.click()} title="Bild" className={`w-11 h-11 md:w-auto md:h-auto md:p-1 flex items-center justify-center rounded-lg text-neutral-400 ${s.btn} transition-colors shrink-0`}><Ic n="image" size={15}/></button>
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>
          </div>
        </div>
      );
    };

    // ── Week Sidebar ───────────────────────────────────────────────
    const WeekSidebar = ({ selectedKw, currentKw, tasks, onSelect, scrollRef, className = '', onClose }) => {
      const weekStats = useMemo(() => {
        const map = {};
        for (let w = 1; w <= 52; w++) {
          const visible = tasks.filter(t => t.startKw <= w && (t.endKw === null || t.endKw >= w));
          map[w] = { total: visible.length, done: tasks.filter(t => t.endKw === w).length };
        }
        return map;
      }, [tasks]);

      return (
        <div className={`w-64 md:w-60 bg-white dark:bg-neutral-900 border-l border-neutral-200 dark:border-neutral-800 flex-col shrink-0 ${className}`}>
          <div className="px-4 py-3.5 border-b border-neutral-100 dark:border-neutral-800 shrink-0 flex items-center justify-between safe-top">
            <div>
              <p className="font-display text-sm font-semibold text-neutral-700 dark:text-neutral-200">Jahresplan</p>
              <p className="text-xs text-neutral-400 mt-0.5">{new Date().getFullYear()} · 52 Wochen</p>
            </div>
            {onClose && <button onClick={onClose} className="md:hidden p-2 -mr-2 rounded-xl text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800"><Ic n="x" size={16}/></button>}
          </div>
          <div className="flex-1 overflow-y-auto p-2" ref={scrollRef}>
            {Array.from({length:52},(_,i)=>i+1).map(w => {
              const sel = selectedKw===w, cur = currentKw===w;
              const { total, done } = weekStats[w] || {};
              const allDone = total > 0 && done === total;
              return (
                <button key={w} data-kw={w} data-active={sel} onClick={()=>onSelect(w)}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl mb-0.5 text-left transition-all
                    ${sel ? 'bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 shadow-sm' : cur ? 'bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300' : 'text-neutral-500 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800/60'}`}>
                  <span className={`text-sm font-medium font-display tabular-nums w-12 shrink-0 ${sel?'':''}`}>KW {w}</span>
                  <span className={`text-[11px] flex-1 truncate ${sel ? 'opacity-70' : 'text-neutral-400 dark:text-neutral-600'}`}>{weekDateRange(w)}</span>
                  {total > 0 && (
                    <span className={`text-[11px] font-semibold tabular-nums shrink-0 flex items-center gap-1
                      ${sel ? 'opacity-90' : allDone ? 'text-emerald-500' : 'text-neutral-400 dark:text-neutral-500'}`}>
                      {allDone && <Ic n="check" size={11}/>}
                      {done>0 ? `${done}/${total}` : total}
                    </span>
                  )}
                  {cur && !sel && <span className="w-1.5 h-1.5 rounded-full bg-blue-500 shrink-0"/>}
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    // ── Kanban ─────────────────────────────────────────────────────
    const KANBAN_COLS = [
      { key:'todo',  label:'To Do', icon:'circle', head:'text-neutral-500 dark:text-neutral-400', tint:'bg-neutral-50/60 dark:bg-neutral-900/40' },
      { key:'doing', label:'Doing', icon:'bolt',    head:'text-blue-500',                          tint:'bg-blue-50/40 dark:bg-blue-950/15' },
      { key:'done',  label:'Done',  icon:'check',   head:'text-emerald-500',                        tint:'bg-emerald-50/40 dark:bg-emerald-950/15' },
    ];
    const QUAD_META = {
      q1: { label:'Q1', full:'Erledigen',  dot:'bg-rose-500',  text:'text-rose-600 dark:text-rose-400' },
      q2: { label:'Q2', full:'Einplanen',  dot:'bg-blue-500',  text:'text-blue-600 dark:text-blue-400' },
      q3: { label:'Q3', full:'Delegieren', dot:'bg-amber-500', text:'text-amber-600 dark:text-amber-400' },
      q4: { label:'Q4', full:'Eliminieren',dot:'bg-zinc-400',  text:'text-zinc-500 dark:text-zinc-400' },
    };
    const kanbanStatusOf = (t, selectedKw) => (t.endKw!==null && t.endKw<=selectedKw) ? 'done' : (t.status==='doing' ? 'doing' : 'todo');

    const KanbanCard = ({ task, onOpenNotes, deleteTask, restoreTask, addToast, onAdvance }) => {
      const [lightbox, setLightbox] = useState(false);
      const meta = QUAD_META[task.quadrant];
      const handleDelete = (e) => {
        e.stopPropagation();
        const snap = { ...task };
        deleteTask(task.id);
        addToast({ message:'Aufgabe gelöscht', action:()=>restoreTask(snap) });
      };
      return (
        <>
          <div draggable
            onDragStart={e=>e.dataTransfer.setData('application/json', JSON.stringify({type:'kanbanTask', id:task.id}))}
            className="group bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-xl p-2.5 cursor-grab active:cursor-grabbing hover:shadow-md hover:-translate-y-px transition-all anim-slide">
            <div className="flex items-center gap-1.5 mb-1">
              <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${meta.dot}`}/>
              <span className={`text-[10px] font-bold uppercase tracking-wide ${meta.text}`}>{meta.label}</span>
              <div className="flex-1"/>
              <div className="act-row opacity-0 group-hover:opacity-100 flex items-center gap-0.5 transition-opacity">
                <button onClick={()=>onAdvance(task)} title="Nächste Spalte" className="p-0.5 rounded text-neutral-400 hover:text-emerald-500 transition-all"><Ic n="arrowRight" size={11}/></button>
                <button onClick={()=>onOpenNotes(task)} title="Notiz" className="p-0.5 rounded text-neutral-400 hover:text-blue-500 transition-all"><Ic n="note" size={11}/></button>
                <button onClick={handleDelete} title="Löschen" className="p-0.5 rounded text-neutral-400 hover:text-rose-500 transition-all"><Ic n="trash" size={11}/></button>
              </div>
            </div>
            <p className="text-sm text-neutral-700 dark:text-neutral-200 leading-snug break-words">{task.text}</p>
            {task.notes && <p className="text-xs text-neutral-400 mt-1 line-clamp-2">{task.notes}</p>}
            {task.image && (
              <img src={task.image} onClick={()=>setLightbox(true)} alt=""
                className="mt-2 max-h-24 rounded-lg border border-neutral-200 dark:border-neutral-700 object-contain cursor-zoom-in hover:opacity-90 transition-opacity"/>
            )}
          </div>
          {lightbox && task.image && <Lightbox src={task.image} onClose={()=>setLightbox(false)}/>}
        </>
      );
    };

    const KanbanBoard = ({ tasks, selectedKw, setKanbanStatus, deleteTask, restoreTask, addToast, updateNotes }) => {
      const [dragOverCol, setDragOverCol] = useState(null);
      const [notesTask, setNotesTask] = useState(null);

      const weekTasks = useMemo(() => tasks.filter(t => t.startKw<=selectedKw && (t.endKw===null||t.endKw>=selectedKw)), [tasks, selectedKw]);
      const columns = useMemo(() => {
        const map = { todo:[], doing:[], done:[] };
        for (const t of weekTasks) map[kanbanStatusOf(t, selectedKw)].push(t);
        return map;
      }, [weekTasks, selectedKw]);

      const handleDrop = (colKey) => (e) => {
        e.preventDefault(); setDragOverCol(null);
        try {
          const d = JSON.parse(e.dataTransfer.getData('application/json'));
          if (d.type === 'kanbanTask') setKanbanStatus(d.id, colKey);
        } catch {}
      };

      return (
        <div className="md:h-full grid grid-cols-1 md:grid-cols-3 gap-3">
          {KANBAN_COLS.map(col => {
            const list = columns[col.key];
            return (
              <div key={col.key}
                onDragOver={e=>{ e.preventDefault(); setDragOverCol(col.key); }}
                onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setDragOverCol(null); }}
                onDrop={handleDrop(col.key)}
                className={`flex flex-col rounded-2xl border overflow-hidden card-shadow transition-all min-h-[140px] md:min-h-0 ${col.tint} border-neutral-200/70 dark:border-neutral-800
                  ${dragOverCol===col.key ? 'ring-2 ring-blue-400 ring-offset-2 ring-offset-neutral-100 dark:ring-offset-neutral-950' : ''}`}>
                <div className="px-4 py-3 bg-white/70 dark:bg-neutral-900/60 backdrop-blur-sm border-b border-neutral-200/60 dark:border-neutral-800 flex items-center justify-between shrink-0">
                  <div className="flex items-center gap-2">
                    <Ic n={col.icon} size={14} cls={col.head}/>
                    <h3 className={`font-display font-semibold text-sm ${col.head}`}>{col.label}</h3>
                  </div>
                  <span className="text-xs font-semibold text-neutral-400 tabular-nums">{list.length}</span>
                </div>
                <div className="flex-1 md:overflow-y-auto p-3 space-y-4 min-h-0">
                  {list.length === 0 ? (
                    <p className="text-xs text-neutral-300 dark:text-neutral-700 text-center py-10">Leer</p>
                  ) : ['q1','q2','q3','q4'].map(q => {
                    const qList = list.filter(t=>t.quadrant===q);
                    if (!qList.length) return null;
                    const meta = QUAD_META[q];
                    return (
                      <div key={q}>
